<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wght@700;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">

<style>
  .tabs { display: flex; gap: 10px; justify-content: center; margin: 20px 0 10px; flex-wrap: wrap; }
  .tabs button { background: rgba(255, 255, 255, .1); box-shadow: none; border: 1px solid rgba(255, 255, 255, .25); }
  .tabs button.on { background: linear-gradient(135deg, #ff2020, #a60e2f); border-color: transparent; }
  .quizbox { max-width: 760px; margin: 0 auto; border-radius: 20px; padding: clamp(18px, 4vw, 30px);
             background: linear-gradient(160deg, rgba(32, 12, 40, .92), rgba(14, 6, 22, .94));
             border: 1px solid rgba(255, 90, 90, .3); box-shadow: 0 14px 40px rgba(0, 0, 0, .5); }
  .progress { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, .12); overflow: hidden; margin-bottom: 18px; }
  .progress div { height: 100%; background: linear-gradient(90deg, #ff2020, #ff9f3b); width: 0; transition: width .35s; }
  .qtext { font-family: "Noto Serif Display", Georgia, serif; font-size: clamp(1.15rem, 3.4vw, 1.6rem); margin-bottom: 16px; }
  .answers { display: grid; gap: 10px; }
  .answers button {
    text-align: left; background: rgba(255, 255, 255, .07); border: 1px solid rgba(255, 255, 255, .18);
    box-shadow: none; font-size: 1rem; padding: 14px 16px; line-height: 1.4;
  }
  .answers button:hover { background: rgba(255, 32, 32, .22); border-color: var(--red); }
  .answers button.right { background: rgba(60, 200, 110, .3); border-color: #4cd97b; }
  .answers button.wrong { background: rgba(255, 50, 50, .3); border-color: var(--red); }
  .result { text-align: center; }
  .result .big { font-size: 4rem; line-height: 1; }
  .result h3 { font-family: "Noto Serif Display", Georgia, serif; font-size: clamp(1.6rem, 6vw, 2.6rem); margin: 8px 0; color: #fff; text-shadow: 0 0 16px var(--red); }
  .scoreline { font-size: 1.1rem; color: var(--dim); margin: 10px 0 16px; }
  .feedback { min-height: 1.6em; text-align: center; font-weight: 800; margin-top: 14px; }
</style>
</head>
<body>

  </div>

</main>

<footer>
  Made with love by <strong>Nora</strong> · A fan site, not made by or connected to Netflix or the Duffer brothers. 🔦
 <span class="secret-dot" style="opacity:.3;cursor:pointer;user-select:none" title="?">11</span></footer>

<script src="site.js"></script>
<script>
"use strict";
/* ============ quiz 1: which character are you? ============ */
/* every character shows up the same number of times, so nobody wins by accident */
const WHO_Q = [
  { q: "Your friends are in trouble. What do you do?", a: [
    ["Go straight at the monster. No plan needed.", "el"],
    ["Make a plan with maps, radios, and snacks.", "dustin"],
    ["Grab something to swing and stand in front of everyone.", "steve"],
    ["Figure out the one clue nobody else noticed.", "robin"]] },
  { q: "Pick a snack.", a: [
    ["Eggo waffles, obviously.", "el"],
    ["Nougat candy. Don't ask why.", "dustin"],
    ["Ice cream from the mall.", "steve"],
    ["Whatever's in the arcade vending machine.", "max"]] },
  { q: "What do you do on a Saturday?", a: [
    ["Beat the high score at the arcade.", "max"],
    ["Run a Dungeons & Dragons campaign.", "eddie"],
    ["Talk to my best friend for five straight hours.", "robin"],
    ["Draw in my room where it's quiet.", "will"]] },
  { q: "Someone is being mean to a kid at school.", a: [
    ["Stare them down until they leave.", "el"],
    ["Make a joke so everyone laughs at them instead.", "eddie"],
    ["Tell them exactly what I think of them.", "erica"],
    ["Walk the kid home so nobody bothers them.", "steve"]] },
  { q: "Pick a way to travel around Hawkins.", a: [
    ["Bike, with the whole party riding together.", "mike"],
    ["Skateboard, going way too fast.", "max"],
    ["Roller skates, obviously.", "erica"],
    ["Walking, so I can keep an eye out.", "lucas"]] },
  { q: "What's your superpower if you could pick?", a: [
    ["Moving things with my mind.", "el"],
    ["Knowing every fact about everything.", "dustin"],
    ["Understanding any language or code.", "robin"],
    ["Never missing what I aim at.", "lucas"]] },
  { q: "Your favorite part of the show?", a: [
    ["The spooky Upside Down stuff.", "will"],
    ["The adventure and the plans.", "mike"],
    ["The music and the 80s clothes.", "eddie"],
    ["The mysteries and the clues.", "robin"]] },
  { q: "Pick a hiding spot in the Upside Down.", a: [
    ["Castle Byers, my own fort.", "will"],
    ["A trailer with a guitar in it.", "eddie"],
    ["The arcade with the lights off.", "max"],
    ["Behind the biggest person I know.", "dustin"]] },
  { q: "What's your job in the group?", a: [
    ["The leader with the plan.", "mike"],
    ["The one who keeps us all realistic.", "lucas"],
    ["The one who says what everyone's thinking.", "erica"],
    ["The one who drives and protects everybody.", "steve"]] },
  { q: "What scares you the most?", a: [
    ["Something waiting in the dark.", "will"],
    ["Nothing. Next question.", "erica"],
    ["Losing one of my friends.", "mike"],
    ["Being left behind again.", "max"]] },
  { q: "Pick a job in Hawkins.", a: [
    ["Scooping ice cream at the mall.", "steve"],
    ["Working the counter and reading everyone.", "robin"],
    ["Negotiating for free stuff.", "erica"],
    ["Fixing radios in my garage.", "dustin"]] },
  { q: "Pick your Dungeons & Dragons character.", a: [
    ["The Dungeon Master who runs it all.", "mike"],
    ["Will the Wise, the wizard.", "will"],
    ["A wild bard with a guitar.", "eddie"],
    ["A knight with the best aim.", "lucas"]] },
];
const WHO_R = {
  el: { face: "🧇", name: "Eleven", text: "Quiet, powerful, and done letting anybody push your friends around. You'd rather show up than talk about it, and you'd flip a van for the people you love." },
  mike: { face: "🎲", name: "Mike", text: "The leader with the plan. You're the one who says 'here's what we're going to do', and you never, ever give up on your friends." },
  dustin: { face: "📻", name: "Dustin", text: "The brain and the heart of the party. You know a weirdly specific fact for every situation, and you always want everyone in on the plan." },
  lucas: { face: "🎯", name: "Lucas", text: "The one with real aim and real sense. You ask the hard questions nobody else wants to ask, and you're right more often than you get credit for." },
  will: { face: "🎨", name: "Will", text: "Gentle, brave and way tougher than anybody realizes. You feel things before everyone else does, and you'd go back into the dark for your friends." },
  max: { face: "🛹", name: "Max", text: "Fast, fearless, and way tougher than people expect. You handle hard things on your own, but your friends always come find you anyway." },
  steve: { face: "🏏", name: "Steve", text: "The protector. You might act goofy, but when something scary shows up you put yourself in front of everyone else. Great hair, too." },
  robin: { face: "🎺", name: "Robin", text: "The one who cracks the code. You notice everything, talk a mile a minute, and you're loyal to your best friend forever." },
  eddie: { face: "🎸", name: "Eddie", text: "Loud, funny, and totally yourself. People misjudge you until the moment it counts, and then you turn out to be the bravest one in the room." },
  erica: { face: "🍨", name: "Erica", text: "Fearless, hilarious, and absolutely not scared of anybody. You say exactly what you think, and you always get your way in the end." },
};

/* ============ quiz 2: trivia ============ */
const TRIVIA = [
  { q: "What year did Will Byers go missing?", a: ["1983", "1979", "1985", "1991"], right: 0, why: "November 1983, the night he rode his bike home." },
  { q: "What is Eleven's favorite food?", a: ["Pizza rolls", "Eggo waffles", "Ice cream", "Nougat"], right: 1, why: "Eggos. She steals a whole box in season 1." },
  { q: "What state is Hawkins in?", a: ["Ohio", "Illinois", "Indiana", "Maine"], right: 2, why: "Hawkins is a made-up town in Indiana." },
  { q: "What's the name of the mall in season 3?", a: ["Starcourt Mall", "Hawkins Plaza", "Palace Mall", "Mirkwood Mall"], right: 0, why: "Starcourt Mall, with a secret Russian base underneath." },
  { q: "Which song pulls Max out of Vecna's trance?", a: ["Master of Puppets", "Should I Stay or Should I Go", "Running Up That Hill", "Africa"], right: 2, why: "Kate Bush's Running Up That Hill, her favorite song." },
  { q: "Who leads the Hellfire Club?", a: ["Mike", "Dustin", "Eddie Munson", "Lucas"], right: 2, why: "Eddie runs the school's Dungeons & Dragons club." },
  { q: "What was Vecna's name when he was a boy?", a: ["Henry Creel", "Peter Ballard", "Martin Brenner", "Billy Hargrove"], right: 0, why: "Henry Creel, who later became test subject One." },
  { q: "What do the kids call baby Demogorgons?", a: ["Demopups", "Demodogs", "Demobats", "Flayers"], right: 1, why: "Dustin squished together Demogorgon and dogs." },
  { q: "How did Joyce talk to Will when he was gone?", a: ["A walkie-talkie", "Dreams", "Christmas lights and an alphabet", "A phone in the woods"], right: 2, why: "She painted the alphabet on the wall and hung lights." },
  { q: "What was Dustin's pet named?", a: ["Dart", "Mews", "Yertle", "Bob"], right: 0, why: "Dart, short for D'Artagnan, who grew into a Demodog." },
  { q: "Where did Steve and Robin work in season 3?", a: ["Melvald's", "Scoops Ahoy", "Family Video", "The Palace Arcade"], right: 1, why: "Scoops Ahoy, in those sailor outfits." },
  { q: "What song did Eddie play in the Upside Down?", a: ["Master of Puppets", "Enter Sandman", "The NeverEnding Story", "Every Breath You Take"], right: 0, why: "Metallica's Master of Puppets, to pull the Demobats away." },
];

/* ============ the machine that runs both quizzes ============ */
const box = document.getElementById("quizbox");
const shuffle = arr => arr.map(v => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map(v => v[1]);
let mode = "who", qs = [], idx = 0, scores = {}, correct = 0;

function start(which) {
  mode = which; idx = 0; correct = 0; scores = {};
  qs = which === "who" ? shuffle(WHO_Q).slice(0, 6) : shuffle(TRIVIA).slice(0, 10);
  document.getElementById("tab-who").classList.toggle("on", which === "who");
  document.getElementById("tab-trivia").classList.toggle("on", which === "trivia");
  render();
}
function render() {
  if (idx >= qs.length) return finish();
  const q = qs[idx];
  const answers = mode === "who" ? shuffle(q.a) : q.a.map((t, i) => [t, i]);
  box.innerHTML = `
    <div class="progress"><div style="width:${idx / qs.length * 100}%"></div></div>
    <p style="color:var(--dim);font-weight:800">Question ${idx + 1} of ${qs.length}</p>
    <p class="qtext">${q.q}</p>
    <div class="answers">${answers.map(([t, v]) => `<button data-v="${v}">${t}</button>`).join("")}</div>
    <p class="feedback" id="fb"></p>`;
  box.querySelectorAll(".answers button").forEach(b => { b.onclick = () => choose(b, q); });
}
function choose(btn, q) {
  box.querySelectorAll(".answers button").forEach(b => b.disabled = true);
  if (mode === "who") {
    const v = btn.dataset.v;
    scores[v] = (scores[v] || 0) + 1;
    btn.classList.add("right"); beep(720, .12);
    setTimeout(() => { idx++; render(); }, 320);
  } else {
    const pickedIdx = +btn.dataset.v, ok = pickedIdx === q.right;
    btn.classList.add(ok ? "right" : "wrong");
    if (!ok) box.querySelector(`.answers button[data-v="${q.right}"]`).classList.add("right");
    if (ok) { correct++; tune([660, 880]); } else { beep(180, .3, "sawtooth", .08); }
    document.getElementById("fb").textContent = (ok ? "✅ Yes! " : "❌ Nope. ") + q.why;
    setTimeout(() => { idx++; render(); }, 1700);
  }
}
function finish() {
  if (mode === "who") {
    /* if there's a tie, pick randomly between the tied characters so nobody always wins */
    const top = Math.max(...Object.values(scores));
    const tied = Object.keys(scores).filter(k => scores[k] === top);
    const best = tied[Math.floor(Math.random() * tied.length)] || "el";
    const r = WHO_R[best];
    tune([523, 659, 784, 1047]);
    box.innerHTML = `
      <div class="result">
        <div class="big">${r.face}</div>
        <h3>You are ${r.name}!</h3>
        <p class="scoreline">${r.text}</p>
        <div class="row">
          <button onclick="start('who')">🔁 Try again</button>
          <button class="ghost" onclick="start('trivia')">🧠 Now do the trivia</button>
        </div>
      </div>`;
  } else {
    const pct = Math.round(correct / qs.length * 100);
    const rank = pct === 100 ? ["🏆", "Hawkins Legend", "Perfect score! Even Dustin would be impressed."]
      : pct >= 80 ? ["🔦", "Party Member", "You know your stuff. Welcome to the Hellfire Club."]
      : pct >= 50 ? ["🚲", "Hawkins Kid", "Not bad! Time for a rewatch to get the rest."]
      : ["🧇", "New in Town", "That's okay, everyone starts somewhere. Go watch it again!"];
    tune([523, 659, 784]);
    try {
      const best = +(localStorage.getItem("stTriviaBest") || 0);
      if (correct > best) localStorage.setItem("stTriviaBest", correct);
    } catch (e) {}
    let best = correct;
    try { best = Math.max(correct, +(localStorage.getItem("stTriviaBest") || 0)); } catch (e) {}
    box.innerHTML = `
      <div class="result">
        <div class="big">${rank[0]}</div>
        <h3>${rank[1]}</h3>
        <p class="scoreline">You got <b>${correct} out of ${qs.length}</b> right.<br>${rank[2]}<br>Your best ever: ${best}/10</p>
        <div class="row">
          <button onclick="start('trivia')">🔁 Play again</button>
          <button class="ghost" onclick="start('who')">🔮 Which character are you?</button>
        </div>
      </div>`;
  }
}
document.getElementById("tab-who").onclick = () => start("who");
document.getElementById("tab-trivia").onclick = () => start("trivia");
start("who");
</script>
<script src="/secret.js"></script>
</body>
