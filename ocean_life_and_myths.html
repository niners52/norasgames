<script>
"use strict";

/* ===================================================================
   OCEAN LIFE AND MYTHS — homepage canvas
   ================================================================ */
const canvas = document.getElementById("ocean");
const ctx = canvas.getContext("2d");
let W, H;
function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  rebuildCorals();
}
window.addEventListener("resize", resize);

const TAU   = Math.PI * 2;
const rand  = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b));
let frame = 0;

/* ---------- helpers ---------- */
function radialGlow(x, y, r, color) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color);
  g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, TAU);
  ctx.fill();
}

/* ---------- bubbles drifting up ---------- */
const bubbles = [];
function seedBubbles() {
  bubbles.length = 0;
  for (let i = 0; i < 70; i++) {
    bubbles.push({
      x: Math.random() * 1600,
      y: Math.random() * 900,
      r: 2 + Math.random() * 8,
      vy: -0.3 - Math.random() * 1.0,
      wob: Math.random() * TAU,
      wobSpeed: 0.01 + Math.random() * 0.04
    });
  }
}
seedBubbles();

/* ---------- coral on the floor ---------- */
const corals = [];
function rebuildCorals() {
  corals.length = 0;
  for (let i = 0; i < 26; i++) {
    corals.push({
      x: Math.random() * W,
      h: 30 + Math.random() * 100,
      w: 12 + Math.random() * 28,
      hue: 280 + Math.random() * 80,
      swayPhase: Math.random() * TAU
    });
  }
}

/* ---------- cephalopods rising slowly from the deep ---------- */
const cephs = [];
// Glowing magical cephalopods only — heavy on glass squids + octopuses
const TYPES = ["glass", "glass", "glass", "octopus", "octopus", "squid"];
function spawnCeph(initial) {
  cephs.push({
    type:  TYPES[randi(0, TYPES.length)],
    x:     60 + Math.random() * 1500,
    y:     initial ? 100 + Math.random() * 700 : 1000,
    vy:    -0.18 - Math.random() * 0.32,
    vx:    (Math.random() - 0.5) * 0.18,
    swim:  Math.random() * TAU,
    swimSpeed: 0.025 + Math.random() * 0.035,
    size:  0.55 + Math.random() * 0.7
  });
}
for (let i = 0; i < 12; i++) spawnCeph(true);

/* ---------- background gradient + light shafts ---------- */
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0,    "#5dc8ff");
  g.addColorStop(0.40, "#1d6db8");
  g.addColorStop(0.80, "#082750");
  g.addColorStop(1,    "#031530");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawGodRays() {
  ctx.save();
  ctx.globalCompositeOperation = "screen";
  for (let i = 0; i < 7; i++) {
    const x = (i * 220 + frame * 0.30) % (W + 220) - 110;
    const intensity = 0.06 + Math.sin(frame * 0.005 + i) * 0.025;
    ctx.fillStyle = `rgba(150, 220, 255, ${intensity})`;
    ctx.beginPath();
    ctx.moveTo(x - 35, 0);
    ctx.lineTo(x + 35, 0);
    ctx.lineTo(x + 220, H);
    ctx.lineTo(x - 220, H);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

function drawBubbles() {
  ctx.save();
  ctx.globalCompositeOperation = "screen";
  for (const b of bubbles) {
    b.wob += b.wobSpeed;
    b.x += Math.sin(b.wob) * 0.3;
    b.y += b.vy;
    if (b.y < -20) { b.y = H + 20; b.x = Math.random() * W; }
    if (b.x < -20 || b.x > W + 20) b.x = Math.random() * W;
    ctx.strokeStyle = "rgba(180, 230, 255, 0.55)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, TAU);
    ctx.stroke();
    ctx.fillStyle = "rgba(255, 255, 255, 0.45)";
    ctx.beginPath();
    ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.25, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

/* ===================================================================
   MASSIVE TERRIFYING KRAKEN
   ================================================================ */
function drawKraken() {
  const cx = W / 2;
  const cy = Math.min(H * 0.62, H - 240);

  /* deep purple aura suggesting his presence */
  ctx.save();
  ctx.globalCompositeOperation = "multiply";
  const aura = ctx.createRadialGradient(cx, cy, 60, cx, cy, Math.max(W, H) * 0.8);
  aura.addColorStop(0, "rgba(20, 0, 50, 0.7)");
  aura.addColorStop(1, "rgba(20, 0, 50, 0)");
  ctx.fillStyle = aura;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();

  /* 8 LONG curving tentacles spreading dramatically across the screen */
  const baseLen = Math.max(520, Math.min(W * 0.65, H * 0.85));
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * TAU - Math.PI / 2;
    // varied length per tentacle for organic asymmetry
    const lenMul = 0.78 + ((i * 137 + 53) % 36) / 100;
    drawLongKrakenTentacle(cx, cy + 25, a, baseLen * lenMul, 60, i);
  }

  /* body bulb — dark silhouette with subtle inner glow */
  ctx.save();
  const bodyGrad = ctx.createRadialGradient(cx - 40, cy - 60, 20, cx, cy, 220);
  bodyGrad.addColorStop(0,    "rgba(60, 30, 90, 0.95)");
  bodyGrad.addColorStop(0.5,  "rgba(20, 5, 40, 0.95)");
  bodyGrad.addColorStop(1,    "rgba(8, 0, 20, 0.92)");
  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.ellipse(cx, cy, 175, 145, 0, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = "rgba(120, 60, 180, 0.45)";
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.restore();

  /* glowing burning-orange eyes */
  const eyePulse = 0.7 + 0.3 * Math.sin(frame * 0.05);
  ctx.save();
  ctx.globalCompositeOperation = "screen";
  for (let s = -1; s <= 1; s += 2) {
    radialGlow(cx + s * 65, cy - 35, 80, `rgba(255, 130, 30, ${0.6 * eyePulse})`);
  }
  ctx.restore();
  for (let s = -1; s <= 1; s += 2) {
    const ex = cx + s * 65, ey = cy - 35;
    ctx.fillStyle = `rgba(255, 230, 180, ${eyePulse})`;
    ctx.beginPath(); ctx.arc(ex, ey, 14, 0, TAU); ctx.fill();
    ctx.fillStyle = "rgba(140, 0, 0, 1)";
    ctx.beginPath(); ctx.ellipse(ex, ey, 5, 12, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "#000";
    ctx.beginPath(); ctx.ellipse(ex, ey, 1.6, 9, 0, 0, TAU); ctx.fill();
  }

  /* angry brow */
  ctx.strokeStyle = "rgba(0, 0, 0, 0.8)";
  ctx.lineWidth = 6;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(cx - 95, cy - 75); ctx.lineTo(cx - 50, cy - 38);
  ctx.moveTo(cx + 50, cy - 38); ctx.lineTo(cx + 95, cy - 75);
  ctx.stroke();

  /* sinister beak suggestion below the eyes */
  ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
  ctx.beginPath();
  ctx.moveTo(cx - 22, cy + 10);
  ctx.quadraticCurveTo(cx, cy + 38, cx + 22, cy + 10);
  ctx.quadraticCurveTo(cx, cy + 22, cx - 22, cy + 10);
  ctx.closePath();
  ctx.fill();
}

/* Long curving kraken tentacle — built from a multi-point spine that
   organically waves with multiple sine harmonics, then drawn as a smooth
   tapered ribbon following the spine's perpendicular tangent. */
function drawLongKrakenTentacle(cx, cy, angle, length, baseW, idx) {
  const t = frame * 0.014;
  const segs = 7;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle);

  /* Build the spine — base is straight, the further out we go the more it whips around */
  const spine = [];
  for (let i = 0; i <= segs; i++) {
    const u = i / segs;
    const x = u * length;
    // organic curl: low-frequency sweep + higher-frequency wiggle, both scaled by u
    const curl1 = Math.sin(u * 2.2 + t + idx * 1.3) * 95 * u;
    const curl2 = Math.sin(u * 5.0 + t * 0.7 + idx * 0.7) * 35 * u * u;
    const y = curl1 + curl2;
    const w = baseW * Math.pow(1 - u, 0.55);   // gradual taper to the tip
    spine.push({ x, y, w });
  }

  /* For each spine point compute perpendicular offsets so the ribbon follows the curve */
  const top = [], bot = [];
  for (let i = 0; i < spine.length; i++) {
    const cur = spine[i];
    let tx, ty;
    if (i === 0)                         { tx = spine[1].x - cur.x;          ty = spine[1].y - cur.y; }
    else if (i === spine.length - 1)     { tx = cur.x - spine[i - 1].x;      ty = cur.y - spine[i - 1].y; }
    else                                 { tx = spine[i + 1].x - spine[i - 1].x; ty = spine[i + 1].y - spine[i - 1].y; }
    const tlen = Math.hypot(tx, ty) || 1;
    const nx = -ty / tlen;
    const ny =  tx / tlen;
    top.push({ x: cur.x + nx * cur.w / 2, y: cur.y + ny * cur.w / 2 });
    bot.push({ x: cur.x - nx * cur.w / 2, y: cur.y - ny * cur.w / 2 });
  }

  /* Smoothly stroke the silhouette using quadratic curves through midpoints */
  ctx.fillStyle = "rgba(15, 5, 30, 0.92)";
  ctx.beginPath();
  ctx.moveTo(top[0].x, top[0].y);
  for (let i = 1; i < top.length - 1; i++) {
    const xc = (top[i].x + top[i + 1].x) / 2;
    const yc = (top[i].y + top[i + 1].y) / 2;
    ctx.quadraticCurveTo(top[i].x, top[i].y, xc, yc);
  }
  ctx.lineTo(top[top.length - 1].x, top[top.length - 1].y);
  // bottom edge in reverse
  for (let i = bot.length - 2; i > 0; i--) {
    const xc = (bot[i].x + bot[i - 1].x) / 2;
    const yc = (bot[i].y + bot[i - 1].y) / 2;
    ctx.quadraticCurveTo(bot[i].x, bot[i].y, xc, yc);
  }
  ctx.lineTo(bot[0].x, bot[0].y);
  ctx.closePath();
  ctx.fill();

  /* faint purple edge highlight */
  ctx.strokeStyle = "rgba(120, 60, 180, 0.30)";
  ctx.lineWidth = 1;
  ctx.stroke();

  /* glowing suckers down the length of the tentacle */
  ctx.fillStyle = "rgba(180, 100, 220, 0.55)";
  for (let i = 1; i < spine.length - 1; i++) {
    const wp = spine[i];
    const r  = wp.w * 0.20;
    ctx.beginPath();
    ctx.arc(wp.x, wp.y, r, 0, TAU);
    ctx.fill();
  }

  ctx.restore();
}

/* ===================================================================
   OCEAN FLOOR — sand, broken shipwrecks, glowing coral
   ================================================================ */
function drawOceanFloor() {
  ctx.save();

  /* sandy seabed */
  const floorGrad = ctx.createLinearGradient(0, H - 100, 0, H);
  floorGrad.addColorStop(0, "#1a3358");
  floorGrad.addColorStop(1, "#0a1830");
  ctx.fillStyle = floorGrad;
  ctx.beginPath();
  ctx.moveTo(0, H);
  ctx.lineTo(0, H - 60);
  for (let x = 0; x <= W; x += 40) {
    const y = H - 60 + Math.sin(x * 0.02) * 12 + Math.cos(x * 0.011) * 8;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();

  /* shipwrecks — two of them, broken */
  drawShipwreck(W * 0.18, H - 50, 0.85);
  drawShipwreck(W * 0.78, H - 60, 1.0);

  /* glowing coral */
  for (const c of corals) {
    const sway = Math.sin(frame * 0.02 + c.swayPhase) * 6;
    const grad = ctx.createLinearGradient(c.x, H - 70, c.x, H - 70 - c.h);
    grad.addColorStop(0, `hsla(${c.hue}, 70%, 25%, 1)`);
    grad.addColorStop(1, `hsla(${c.hue}, 90%, 60%, 0.92)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(c.x - c.w / 2, H - 70);
    ctx.quadraticCurveTo(c.x + sway, H - 70 - c.h / 2, c.x + sway / 2, H - 70 - c.h);
    ctx.quadraticCurveTo(c.x - sway, H - 70 - c.h / 2, c.x + c.w / 2, H - 70);
    ctx.closePath();
    ctx.fill();

    /* glowing tip */
    radialGlow(c.x + sway / 2, H - 70 - c.h, 24, `hsla(${c.hue}, 100%, 80%, 0.55)`);
  }

  ctx.restore();
}

function drawShipwreck(x, y, scale) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);
  ctx.rotate(0.22);

  /* hull silhouette */
  ctx.fillStyle = "#1a1208";
  ctx.beginPath();
  ctx.moveTo(-95, 0);
  ctx.bezierCurveTo(-75, -45, 75, -50, 95, 0);
  ctx.lineTo(75, 32);
  ctx.lineTo(-75, 32);
  ctx.closePath();
  ctx.fill();

  /* plank lines */
  ctx.strokeStyle = "rgba(40, 25, 12, 0.9)";
  ctx.lineWidth = 1;
  for (let yy = -22; yy < 28; yy += 7) {
    ctx.beginPath();
    ctx.moveTo(-80, yy);
    ctx.lineTo(80, yy);
    ctx.stroke();
  }

  /* broken mast */
  ctx.fillStyle = "#2a1a0a";
  ctx.fillRect(-3, -95, 6, 95);
  ctx.beginPath();
  ctx.moveTo(-6, -95); ctx.lineTo(0, -108); ctx.lineTo(6, -95);
  ctx.closePath();
  ctx.fill();

  /* gaping hole in hull */
  ctx.fillStyle = "#000";
  ctx.beginPath();
  ctx.ellipse(15, 4, 22, 13, 0.3, 0, TAU);
  ctx.fill();

  /* faint barnacles around the hull */
  ctx.fillStyle = "rgba(80, 60, 40, 0.65)";
  for (let i = 0; i < 6; i++) {
    ctx.beginPath();
    ctx.arc(-70 + i * 26, rand(-15, 25), 2.5, 0, TAU);
    ctx.fill();
  }

  ctx.restore();
}

/* ===================================================================
   CEPHALOPODS — glass squid, octopus, giant squid, cuttlefish
   ================================================================ */
function drawCephalopod(c) {
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.scale(c.size, c.size);

  if      (c.type === "glass")   drawGlassSquid(c);
  else if (c.type === "octopus") drawOctopus(c);
  else if (c.type === "squid")   drawGiantSquid(c);
  else if (c.type === "cuttle")  drawCuttlefish(c);

  ctx.restore();
}

function drawGlassSquid(c) {
  /* bright cyan halo */
  radialGlow(0, 0, 50, "rgba(120, 230, 255, 0.65)");
  radialGlow(0, 0, 30, "rgba(255, 255, 255, 0.45)");

  /* 8 wiggling tentacles below */
  ctx.lineCap = "round";
  for (let i = 0; i < 8; i++) {
    const u = (i - 3.5) / 3.5;
    const wig = Math.sin(c.swim + i * 0.5) * 4;
    const baseX = u * 10;
    const tipX  = u * 16 + wig;
    ctx.strokeStyle = "rgba(140, 235, 255, 0.55)";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(baseX, 14);
    ctx.quadraticCurveTo(baseX + wig * 0.5, 30, tipX, 44);
    ctx.stroke();
    ctx.strokeStyle = "rgba(255, 255, 255, 0.85)";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(baseX, 14);
    ctx.quadraticCurveTo(baseX + wig * 0.5, 30, tipX, 44);
    ctx.stroke();
  }

  /* see-through glass body */
  const body = ctx.createRadialGradient(-5, -8, 2, 0, 0, 22);
  body.addColorStop(0,   "rgba(220, 255, 255, 0.75)");
  body.addColorStop(0.5, "rgba(150, 230, 255, 0.45)");
  body.addColorStop(1,   "rgba(80, 180, 235, 0.15)");
  ctx.fillStyle = body;
  ctx.beginPath();
  ctx.ellipse(0, 0, 18, 22, 0, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = "rgba(190, 245, 255, 0.85)";
  ctx.lineWidth = 1;
  ctx.stroke();

  /* glowing inner heart */
  const pulse = 1 + Math.sin(frame * 0.18) * 0.2;
  ctx.fillStyle = "rgba(120, 230, 255, 0.9)";
  ctx.beginPath();
  ctx.arc(0, 4, 3 * pulse, 0, TAU);
  ctx.fill();

  /* eyes */
  ctx.fillStyle = "rgba(255, 255, 255, 0.95)";
  ctx.beginPath();
  ctx.arc(-6, -3, 2.5, 0, TAU);
  ctx.arc( 6, -3, 2.5, 0, TAU);
  ctx.fill();
  ctx.fillStyle = "#063";
  ctx.beginPath();
  ctx.arc(-6, -3, 1.2, 0, TAU);
  ctx.arc( 6, -3, 1.2, 0, TAU);
  ctx.fill();
}

function drawOctopus(c) {
  /* 8 curling tentacles */
  for (let i = 0; i < 8; i++) {
    const baseAng = (i / 8) * TAU + Math.PI / 2;
    const wig1 = Math.sin(c.swim + i * 0.7) * 0.2;
    const wig2 = Math.sin(c.swim * 1.5 + i) * 0.3;
    const x1 = Math.cos(baseAng + wig1) * 22;
    const y1 = Math.sin(baseAng + wig1) * 22;
    const x2 = Math.cos(baseAng + wig2) * 42;
    const y2 = Math.sin(baseAng + wig2) * 42 + 8;

    ctx.strokeStyle = "#a0402a";
    ctx.lineWidth = 6;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(0, 5);
    ctx.bezierCurveTo(x1 * 0.5, y1 * 0.5 + 5, x1, y1 + 5, x2, y2);
    ctx.stroke();
    ctx.strokeStyle = "#ff7050";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, 5);
    ctx.bezierCurveTo(x1 * 0.5, y1 * 0.5 + 5, x1, y1 + 5, x2, y2);
    ctx.stroke();
  }

  /* bulbous head */
  const grad = ctx.createRadialGradient(-5, -10, 2, 0, 0, 28);
  grad.addColorStop(0, "#ff8a60");
  grad.addColorStop(1, "#a0402a");
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.ellipse(0, 0, 22, 26, 0, 0, TAU);
  ctx.fill();

  /* tiny mantle highlights (deterministic, not random per-frame) */
  ctx.fillStyle = "rgba(255, 200, 150, 0.55)";
  ctx.beginPath(); ctx.arc(-9, -12, 1.6, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc( 4,  -8, 1.6, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(10,  -2, 1.6, 0, TAU); ctx.fill();

  /* eyes */
  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.arc(-7, -4, 4, 0, TAU);
  ctx.arc( 7, -4, 4, 0, TAU);
  ctx.fill();
  ctx.fillStyle = "#222";
  ctx.beginPath();
  ctx.arc(-7, -4, 1.6, 0, TAU);
  ctx.arc( 7, -4, 1.6, 0, TAU);
  ctx.fill();
}

function drawGiantSquid(c) {
  /* long pink mantle */
  const mantle = ctx.createLinearGradient(0, -55, 0, 30);
  mantle.addColorStop(0, "#c84a8a");
  mantle.addColorStop(1, "#7a2050");
  ctx.fillStyle = mantle;
  ctx.beginPath();
  ctx.moveTo(0, -55);
  ctx.bezierCurveTo(20, -55, 22, -10, 18, 22);
  ctx.bezierCurveTo(8, 30, -8, 30, -18, 22);
  ctx.bezierCurveTo(-22, -10, -20, -55, 0, -55);
  ctx.closePath();
  ctx.fill();

  /* lateral fins */
  ctx.fillStyle = "rgba(220, 130, 175, 0.7)";
  ctx.beginPath();
  ctx.ellipse(-22, -45, 6, 15, -0.3, 0, TAU);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse( 22, -45, 6, 15,  0.3, 0, TAU);
  ctx.fill();

  /* 8 short arms */
  for (let i = 0; i < 8; i++) {
    const u = (i - 3.5) / 3.5;
    const wig = Math.sin(c.swim + i) * 4;
    ctx.strokeStyle = "#a83870";
    ctx.lineWidth = 3;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(u * 10, 24);
    ctx.quadraticCurveTo(u * 12 + wig, 38, u * 16 + wig, 52);
    ctx.stroke();
  }

  /* 2 long feeding tentacles */
  for (let s = -1; s <= 1; s += 2) {
    const wig = Math.sin(c.swim) * 8 * s;
    ctx.strokeStyle = "#a83870";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(s * 5, 24);
    ctx.bezierCurveTo(s * 18 + wig, 50, s * 25 + wig * 1.2, 80, s * 22 + wig * 0.5, 105);
    ctx.stroke();
    /* club tip */
    ctx.fillStyle = "#a83870";
    ctx.beginPath();
    ctx.ellipse(s * 22 + wig * 0.5, 105, 5, 8, 0, 0, TAU);
    ctx.fill();
  }

  /* big eyes */
  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.arc(-9, -8, 5, 0, TAU);
  ctx.arc( 9, -8, 5, 0, TAU);
  ctx.fill();
  ctx.fillStyle = "#222";
  ctx.beginPath();
  ctx.arc(-9, -8, 2.2, 0, TAU);
  ctx.arc( 9, -8, 2.2, 0, TAU);
  ctx.fill();
}

function drawCuttlefish(c) {
  /* body */
  const body = ctx.createRadialGradient(-5, -5, 3, 0, 0, 30);
  body.addColorStop(0, "#d8b890");
  body.addColorStop(1, "#806040");
  ctx.fillStyle = body;
  ctx.beginPath();
  ctx.ellipse(0, 0, 26, 32, 0, 0, TAU);
  ctx.fill();

  /* continuous fin around the body */
  ctx.strokeStyle = "rgba(220, 190, 160, 0.65)";
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.ellipse(0, 0, 30, 36, 0, 0, TAU);
  ctx.stroke();

  /* undulating fin edge */
  ctx.strokeStyle = "rgba(255, 220, 180, 0.4)";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let a = 0; a < TAU + 0.05; a += 0.1) {
    const r = 30 + Math.sin(a * 8 + c.swim) * 1.5;
    const x = Math.cos(a) * r;
    const y = Math.sin(a) * (r * 1.2);
    if (a === 0) ctx.moveTo(x, y);
    else         ctx.lineTo(x, y);
  }
  ctx.stroke();

  /* camouflage stripes */
  ctx.strokeStyle = "rgba(60, 40, 25, 0.5)";
  ctx.lineWidth = 1;
  for (let r = -18; r < 18; r += 7) {
    ctx.beginPath();
    ctx.moveTo(-22, r);
    for (let xx = -22; xx <= 22; xx += 3) {
      const yy = r + Math.sin(xx * 0.3 + c.swim) * 1.2;
      ctx.lineTo(xx, yy);
    }
    ctx.stroke();
  }

  /* 8 short arms */
  for (let i = 0; i < 8; i++) {
    const u = (i - 3.5) / 3.5;
    const wig = Math.sin(c.swim + i) * 3;
    ctx.strokeStyle = "#806040";
    ctx.lineWidth = 2.5;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(u * 9, 28);
    ctx.quadraticCurveTo(u * 11 + wig, 36, u * 13 + wig, 44);
    ctx.stroke();
  }

  /* W-shaped pupils (cuttlefish signature) */
  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.arc(-9, -10, 5, 0, TAU);
  ctx.arc( 9, -10, 5, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = "#222";
  ctx.lineWidth = 1.8;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(-12, -11); ctx.quadraticCurveTo(-9, -8, -6, -11);
  ctx.moveTo(  6, -11); ctx.quadraticCurveTo( 9, -8, 12, -11);
  ctx.stroke();
}

/* ===================================================================
   MAIN LOOP
   ================================================================ */
function loop() {
  frame++;

  drawBackground();
  drawGodRays();
  drawKraken();        // huge silhouette dominating the middle
  drawOceanFloor();    // foreground floor + coral + shipwrecks

  /* topup + draw cephalopods */
  if (cephs.length < 14 && Math.random() < 0.005) spawnCeph(false);
  for (let i = cephs.length - 1; i >= 0; i--) {
    const c = cephs[i];
    c.swim += c.swimSpeed;
    c.x += c.vx;
    c.y += c.vy;
    if (c.y < -150) cephs.splice(i, 1);
    else            drawCephalopod(c);
  }

  drawBubbles();

  requestAnimationFrame(loop);
}

resize();
loop();
</script>
