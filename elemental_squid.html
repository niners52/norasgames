  // boss picks a fresh random Y target every ~1-2 seconds and chases it; faster at higher levels
  boss.evadeTimer = (boss.evadeTimer || 0) - 1;
  if (boss.evadeTimer <= 0) {
    boss.evadeY = rand(H * 0.18, H * 0.82);
    boss.evadeTimer = randi(35, 95);
  }
  const ySpeed = 0.025 + level * 0.008 + (boss.final ? 0.02 : 0);
  boss.y += (boss.evadeY - boss.y) * ySpeed;
  boss.y += Math.sin(boss.t * 0.04 + boss.id) * (2.4 + level * 0.4);
  // unpredictable horizontal darting
  const targetX = W * 0.78 + Math.sin(boss.t * 0.015) * (60 + level * 12);
  const xSpeed = 0.012 + level * 0.004 + (boss.final ? 0.012 : 0);
  boss.x += (targetX - boss.x) * xSpeed;

  // FIRE RATE SCALES WITH LEVEL (each level shoots a bit faster — gentler ramp)
  const fireRateScale = Math.max(0.65, 1 - level * 0.08);
  const effectiveFireRate = Math.max(20, Math.floor(boss.fireRate * fireRateScale));
  // DAMAGE SCALES WITH LEVEL (gentler than before)
  const dmgScale = 1 + level * 0.13;

  boss.cd = ((boss.cd ?? boss.fireRate)) - 1;
  if (boss.cd <= 0 && player.invisTimer <= 0) {
    boss.cd = effectiveFireRate;
    const dx = player.x - boss.x;
    const dy = player.y - boss.y;
    const m = Math.hypot(dx, dy) || 1;
    const sp = 5.0 + level * 0.25;

    if (boss.pattern === "single") {
      // tight 3-bullet burst
      const a0 = Math.atan2(dy, dx);
      for (let k = -1; k <= 1; k++) {
        const aa = a0 + k * 0.10;
        enemyShot(boss.x - 100, boss.y, Math.cos(aa) * sp, Math.sin(aa) * sp, "#ff5500", "#ffaa66", Math.round(11 * dmgScale));
      }
    } else if (boss.pattern === "double") {
      // 4-bullet spread
      const a = Math.atan2(dy, dx);
      for (let k = -1.5; k <= 1.5; k += 1) {
        const aa = a + k * 0.16;
        enemyShot(boss.x - 100, boss.y, Math.cos(aa) * sp, Math.sin(aa) * sp, "#1e6cff", "#9be0ff", Math.round(10 * dmgScale));
      }
    } else if (boss.pattern === "lob") {
      // 3 lobs at staggered heights
      for (let k = -1; k <= 1; k++) {
        enemyShot(boss.x - 100, boss.y + k * 30, (dx / m) * sp + rand(-1, 1), (dy / m) * sp + k * 1.8, "#7a4a1f", "#c79360", Math.round(13 * dmgScale));
      }
    } else if (boss.pattern === "swirl") {
      // 5-bullet swirl (down from 7)
      const a = Math.atan2(dy, dx);
      for (let k = -2; k <= 2; k++) {
        const aa = a + k * 0.12;
        enemyShot(boss.x - 100, boss.y, Math.cos(aa) * sp * 1.10, Math.sin(aa) * sp * 1.10, "#dde6f0", "#ffffff", Math.round(8 * dmgScale));
      }
    } else if (boss.pattern === "spread") {
      // SHADOWSPERM — 5-bullet spread, slightly slower & less damage than before
      const a = Math.atan2(dy, dx);
      for (let k = -2; k <= 2; k++) {
        const aa = a + k * 0.20;
        enemyShot(boss.x - 200, boss.y, Math.cos(aa) * 6.2, Math.sin(aa) * 6.2, "#1d0030", "#a060ff", Math.round(16 * dmgScale), true);
      }
    }
    addBurst(boss.x - 100, boss.y, boss.element >= 0 ? ELEMENTS[boss.element].spark : ["#a060ff", "#5a17a0", "#fff"], 10, 3);
  }

  // collision body damage — kept dangerous but less brutal
  if (player.invisTimer <= 0 && dist(boss.x, boss.y, player.x, player.y) < 80 * boss.scale + player.r) {
    player.hp -= 0.75;
    // throb the hit feedback while in contact (don't spam particles every frame)
    if (frame % 8 === 0) hurtPlayer(player.x, player.y, "small");
    if (player.hp <= 0) loseLife();
  }

  // dead?
  if (boss.hp <= 0) {
    addBurst(boss.x, boss.y, ["#fff", "#ff0", "#f0f", "#0ff"], 80, 8);
    score += 200;
    if (boss.final) {
      state = "win";
      spawnConfetti();
      recordScore(score);
    } else {
      state = "levelcomplete";
      levelMessageTimer = 180;
    }
    boss = null;
  }
}

function loseLife() {
  lives--;
  // BIG painful hit feedback at the moment of death — dark smoke, red splash, broken heart
  hurtPlayer(player.x, player.y, "big");
  player.hp = player.hpMax;
  player.x = W * 0.25;
  player.y = H * 0.5;
  if (lives < 0) {
    state = "gameover";
    gameOverTimer = 0;   // reset for the slow dramatic fade-in
    recordScore(score);  // save quietly to the leaderboard
  }
}

/* ---------- Level / boss spawn ---------- */
function spawnBoss(idx) {
  const def = BOSS_DEFS[idx];
  boss = {
    name: def.name,
    x: W * 0.78,
    y: H * 0.5,
    hp: def.hp, hpMax: def.hp,
    color: def.color, color2: def.color2,
    element: def.element,
    scale: def.scale,
    fireRate: def.fireRate,
    pattern: def.pattern,
    final: !!def.final,
    cd: 60,
    id: idx
  };
}

function startGame() {
  state = "playing";
  level = 0;
  score = 0;
  lives = 3;
  player.hp = player.hpMax;
  player.x = W * 0.25;
  player.y = H * 0.5;
  player.invisTimer = 0;
  player.invisCooldown = 0;
  player.waveCooldown = 0;
  player.element = 1;
  projectiles.length = 0;
  enemyShots.length = 0;
  particles.length = 0;
  minions.length = 0;
  spawnBoss(0);
}

function nextLevel() {
  level++;
  if (level >= BOSS_DEFS.length) {
    state = "win";
    spawnConfetti();
    recordScore(score);
    return;
  }
  state = "playing";
  player.hp = player.hpMax;
  player.x = W * 0.25;
  player.y = H * 0.5;
  projectiles.length = 0;
  enemyShots.length = 0;
  minions.length = 0;
  spawnBoss(level);
}

function resetGame() {
  startGame();
}

function wrapText(text, x, y, maxW, lh) {
  const words = text.split(" ");
  let line = "";
  let yy = y;
  for (let i = 0; i < words.length; i++) {
    const test = line + words[i] + " ";
    if (ctx.measureText(test).width > maxW && line) {
      ctx.fillText(line.trim(), x, yy);
      yy += lh;
      line = words[i] + " ";
    } else {
      line = test;
    }
  }
  ctx.fillText(line.trim(), x, yy);
}

function drawGameOver() {
  gameOverTimer++;

  // ===== Slow darkness fade-in (over ~120 frames) =====
  const fadeT = Math.min(1, gameOverTimer / 120);
  ctx.fillStyle = `rgba(2,0,5,${0.55 + fadeT * 0.40})`;
  ctx.fillRect(0, 0, W, H);

  // ===== Dark purple evil energy spreading from the center =====
  const energyT = Math.min(1, Math.max(0, (gameOverTimer - 30) / 110));
  if (energyT > 0) {
    ctx.save();
    ctx.globalCompositeOperation = "screen";
    // creeping purple gloom that spreads outward
    const evilGrad = ctx.createRadialGradient(W / 2, H / 2, 40, W / 2, H / 2, Math.max(W, H) * 0.7);
    evilGrad.addColorStop(0,    "rgba(0,0,0,0)");
    evilGrad.addColorStop(0.55, `rgba(60,0,100,${0.35 * energyT})`);
    evilGrad.addColorStop(1,    `rgba(140,40,200,${0.55 * energyT})`);
    ctx.fillStyle = evilGrad;
    ctx.fillRect(0, 0, W, H);

    // pulsing dark-magic tendrils crawling around the edges
    const pulse = 0.5 + 0.5 * Math.sin(frame * 0.04);
    ctx.strokeStyle = `rgba(160,60,220,${(0.4 + pulse * 0.3) * energyT})`;
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    for (let i = 0; i < 18; i++) {
      const a = (i / 18) * TAU + frame * 0.005;
      const r1 = Math.max(W, H) * 0.42;
      const r2 = r1 + 60 + Math.sin(frame * 0.05 + i) * 35;
      ctx.beginPath();
      ctx.moveTo(W / 2 + Math.cos(a) * r1, H / 2 + Math.sin(a) * r1);
      ctx.lineTo(W / 2 + Math.cos(a) * r2, H / 2 + Math.sin(a) * r2);
      ctx.stroke();
    }

    // floating evil purple orbs drifting upward
    for (let i = 0; i < 8; i++) {
      const x = (i * 167 + frame * 0.4) % (W + 100) - 50;
      const y = H - ((i * 89 + frame * 0.6) % H);
      const orbPulse = 0.5 + 0.5 * Math.sin(frame * 0.06 + i);
      radialGlow(x, y, 28, `rgba(140,40,200,${0.55 * orbPulse * energyT})`);
      ctx.fillStyle = `rgba(180,80,255,${orbPulse * energyT})`;
      ctx.beginPath();
      ctx.arc(x, y, 2.5, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  // ===== Shadowsperm laughing in the background (looms in slowly) =====
  const spermT = Math.min(1, Math.max(0, (gameOverTimer - 50) / 90));
  if (spermT > 0) {
    ctx.save();
    ctx.globalAlpha = 0.65 * spermT;
    // laugh = fast bobbing + slight tilt
    const laugh = Math.sin(frame * 0.18) * 10;
    const tilt = Math.sin(frame * 0.18) * 0.06;
    ctx.translate(W * 0.5, H * 0.58 + laugh);
    ctx.rotate(tilt);
    ctx.scale(0.9, 0.9);
    drawWhale({
      x: 0, y: 0,
      color: "#1b0030", color2: "#a64bff",
      scale: 1.9, element: -1, id: 99
    });
    ctx.restore();

    // "HA HA HA" text floating up from him each beat (every ~30 frames)
    if (frame % 30 < 22) {
      ctx.save();
      ctx.globalAlpha = spermT * (1 - (frame % 30) / 30);
      ctx.font = "italic bold 36px Trebuchet MS";
      ctx.fillStyle = `hsl(${280 + Math.sin(frame * 0.05) * 20}, 90%, 65%)`;
      ctx.shadowColor = "#5a0080";
      ctx.shadowBlur = 18;
      ctx.textAlign = "center";
      const lx = W * 0.5 + Math.sin(frame * 0.05) * 40;
      const ly = H * 0.45 - (frame % 30) * 1.5;
      ctx.fillText("HA HA HA!!", lx, ly);
      ctx.shadowBlur = 0;
      ctx.restore();
    }
  }

  // ===== Dramatic text (fades in after the darkness) =====
  const textT = Math.min(1, Math.max(0, (gameOverTimer - 35) / 60));
  if (textT > 0) {
    ctx.save();
    ctx.textAlign = "center";
    ctx.globalAlpha = textT;

    // "ELEMENT PALACE HAS FALLEN!!" — big, blood-red, dramatic
    ctx.font = "bold 68px Trebuchet MS";
    const tgrad = ctx.createLinearGradient(0, 110, 0, 180);
    tgrad.addColorStop(0, "#ff4040");
    tgrad.addColorStop(1, "#660010");
    ctx.fillStyle = tgrad;
    ctx.shadowColor = "#a00";
    ctx.shadowBlur = 28;
    ctx.fillText("ELEMENT PALACE HAS FALLEN!!", W / 2, 150);
    ctx.shadowBlur = 0;

    // subtitle — Shadowsperm has stolen the Wave of Lightness
    ctx.font = "italic 26px Trebuchet MS";
    ctx.fillStyle = "#cca0ff";
    ctx.shadowColor = "#a060ff";
    ctx.shadowBlur = 16;
    ctx.fillText("Shadowsperm has stolen the Wave of Lightness!!", W / 2, 200);
    ctx.shadowBlur = 0;

    // sad small-text line under the subtitle
    ctx.font = "italic 17px Trebuchet MS";
    ctx.fillStyle = "rgba(220,200,255,0.75)";
    ctx.fillText("All hope fades into the dark…", W / 2, 232);

    // final score
    ctx.font = "bold 24px Trebuchet MS";
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "#000";
    ctx.shadowBlur = 8;
    ctx.fillText(`Final Score: ${score}`, W / 2, H - 200);
    ctx.shadowBlur = 0;

    ctx.restore();
  }

  // ===== TRY AGAIN button (fades in last) =====
  const btnT = Math.min(1, Math.max(0, (gameOverTimer - 75) / 40));
  if (btnT > 0) {
    const bw = 290, bh = 74;
    const bx = W / 2 - bw / 2;
    const by = H - 130;
    gameOverBtn.x = bx; gameOverBtn.y = by; gameOverBtn.w = bw; gameOverBtn.h = bh;
    const hover = mouse.x >= bx && mouse.x <= bx + bw && mouse.y >= by && mouse.y <= by + bh;

    ctx.save();
    ctx.globalAlpha = btnT;

    // pulsing red halo (hope flickering even in darkness)
    const bp = 0.5 + 0.5 * Math.sin(frame * 0.1);
    if (hover) {
      radialGlow(W / 2, by + bh / 2, 140, "rgba(255,60,80,0.65)");
    } else {
      radialGlow(W / 2, by + bh / 2, 90, `rgba(180,30,60,${0.35 + bp * 0.25})`);
    }

    // dark blood-red button
    const bgrad = ctx.createLinearGradient(bx, by, bx, by + bh);
    bgrad.addColorStop(0, hover ? "#770020" : "#3a0010");
    bgrad.addColorStop(1, hover ? "#bb0030" : "#660020");
    ctx.fillStyle = bgrad;
    ctx.fillRect(bx, by, bw, bh);

    // borders
    ctx.strokeStyle = hover ? "#fff" : "#ffaaaa";
    ctx.lineWidth = 2.4;
    ctx.strokeRect(bx, by, bw, bh);
    ctx.strokeStyle = "rgba(255,180,180,0.55)";
    ctx.lineWidth = 1;
    ctx.strokeRect(bx + 5, by + 5, bw - 10, bh - 10);

    ctx.font = "bold 30px Trebuchet MS";
    ctx.fillStyle = "#fff";
    ctx.textAlign = "center";
    ctx.shadowColor = hover ? "#fff" : "#a00";
    ctx.shadowBlur = hover ? 16 : 10;
    ctx.fillText("⟲  TRY AGAIN", W / 2, by + bh / 2 + 11);
    ctx.shadowBlur = 0;
    ctx.restore();

    // hint
    ctx.save();
    ctx.font = "13px Trebuchet MS";
    ctx.fillStyle = `rgba(255,200,200,${0.7 * btnT})`;
    ctx.textAlign = "center";
    ctx.fillText("Click TRY AGAIN or press ENTER to face him again", W / 2, H - 30);
    ctx.restore();
  }
}

function drawWin() {
  // ===== light defeating darkness — radiant rays bursting from the center =====
  ctx.save();
  ctx.globalCompositeOperation = "screen";
  // soft golden bloom over the whole screen
  const bloomGrad = ctx.createRadialGradient(W / 2, H / 2, 60, W / 2, H / 2, Math.max(W, H) * 0.7);
  bloomGrad.addColorStop(0,    "rgba(255,250,200,0.4)");
  bloomGrad.addColorStop(0.4,  "rgba(255,200,255,0.18)");
  bloomGrad.addColorStop(1,    "rgba(40,10,80,0)");
  ctx.fillStyle = bloomGrad;
  ctx.fillRect(0, 0, W, H);

  // 24 rotating rainbow rays radiating outward (pure light pushing back the void)
  const rayCount = 24;
  for (let i = 0; i < rayCount; i++) {
    const a = (i / rayCount) * TAU + frame * 0.005;
    const len = Math.max(W, H);
    const hue = (i * (360 / rayCount) + frame * 1.4) % 360;
    const intensity = 0.18 + Math.sin(frame * 0.04 + i) * 0.08;
    ctx.fillStyle = `hsla(${hue}, 100%, 70%, ${intensity})`;
    ctx.beginPath();
    ctx.moveTo(W / 2, H / 2);
    ctx.lineTo(W / 2 + Math.cos(a + 0.05) * len, H / 2 + Math.sin(a + 0.05) * len);
    ctx.lineTo(W / 2 + Math.cos(a - 0.05) * len, H / 2 + Math.sin(a - 0.05) * len);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  // ===== confetti =====
  updateAndDrawConfetti();

  // ===== softly tinted overlay so text reads cleanly without dimming the celebration =====
  ctx.save();
  ctx.fillStyle = "rgba(8,0,30,0.18)";
  ctx.fillRect(0, 0, W, H);
  ctx.restore();

  // ===== Inky's victory celebration (centered, bobbing + spinning + huge glow) =====
  const bobY = Math.sin(frame * 0.1) * 18;
  const wiggle = Math.sin(frame * 0.06) * 0.18;
  ctx.save();
  ctx.translate(W / 2, H / 2 + 60 + bobY);
  ctx.rotate(wiggle);
  ctx.scale(2.4, 2.4);
  // brighter rainbow halo around the celebrating Inky
  ctx.save();
  ctx.globalCompositeOperation = "screen";
  const heroHue = (frame * 2.4) % 360;
  for (let i = 0; i < 4; i++) {
    radialGlow(0, 0, 110 + i * 20, `hsla(${(heroHue + i * 60) % 360}, 100%, 70%, 0.35)`);
  }
  ctx.restore();
  drawInky({ x: 0, y: 0, element: 1, swim: frame * 0.1, invisTimer: 0 });
  ctx.restore();

  // ===== Three joyfully pulsing rainbow hearts above her =====
  for (let i = 0; i < 3; i++) {
    const hx = W / 2 + (i - 1) * 90;
    const hy = H / 2 - 70 + Math.sin(frame * 0.12 + i * 0.7) * 8;
    const pulse = 1 + Math.sin(frame * 0.18 + i * 1.2) * 0.32;
    const hue = (i * 120 + frame * 2.5) % 360;
    drawPulseHeart(hx, hy, 14 * pulse, `hsl(${hue}, 100%, 65%)`, "#fff");
  }

  // ===== Big glowing victory text =====
  ctx.save();
  ctx.textAlign = "center";

  // line 1 — ELEMENT PALACE IS SAVED!!
  ctx.font = "bold 70px Trebuchet MS";
  const tgrad = ctx.createLinearGradient(0, 80, 0, 160);
  tgrad.addColorStop(0,    "#fffacc");
  tgrad.addColorStop(0.45, "#9bffea");
  tgrad.addColorStop(0.85, "#ff8aff");
  tgrad.addColorStop(1,    "#fff8a0");
  ctx.fillStyle = tgrad;
  ctx.shadowColor = "#fff";
  ctx.shadowBlur = 36;
  ctx.fillText("ELEMENT PALACE IS SAVED!!", W / 2, 130);
  ctx.shadowBlur = 0;

  // line 2 — INKY IS A HERO!! (cycling rainbow hue)
  ctx.font = "bold 64px Trebuchet MS";
  ctx.fillStyle = `hsl(${(frame * 2.5) % 360}, 100%, 72%)`;
  ctx.shadowColor = `hsl(${(frame * 2.5 + 180) % 360}, 100%, 70%)`;
  ctx.shadowBlur = 32;
  ctx.fillText("INKY IS A HERO!! 🦑✨", W / 2, 200);
  ctx.shadowBlur = 0;

  // ===== Final score with sparkle frame =====
  ctx.font = "bold 30px Trebuchet MS";
  ctx.fillStyle = "#ffffff";
  ctx.shadowColor = "#0ff";
  ctx.shadowBlur = 18;
  ctx.fillText(`✨  FINAL SCORE: ${score}  ✨`, W / 2, 250);
  ctx.shadowBlur = 0;

  // ===== NEW HIGH SCORE celebration banner =====
  if (wasNewHighScore) {
    // pulsing scale + cycling rainbow text — extra dramatic
    const npulse = 1 + Math.sin(frame * 0.18) * 0.10;
    ctx.save();
    ctx.translate(W / 2, 308);
    ctx.scale(npulse, npulse);
    // halo behind the banner
    ctx.save();
    ctx.globalCompositeOperation = "screen";
    radialGlow(0, 0, 220, `hsla(${(frame * 4) % 360}, 100%, 75%, 0.55)`);
    radialGlow(0, 0, 130, "rgba(255,240,160,0.5)");
    ctx.restore();
    // banner text
    ctx.font = "bold 44px Trebuchet MS";
    ctx.fillStyle = `hsl(${(frame * 5) % 360}, 100%, 72%)`;
    ctx.shadowColor = "#fff";
    ctx.shadowBlur = 28;
    ctx.fillText("🏆  NEW HIGH SCORE!!  🏆", 0, 0);
    ctx.shadowBlur = 0;
    ctx.restore();
    // continuous extra sparkle bursts around the banner
    if (frame % 4 === 0) {
      addSparkle(W / 2 + rand(-260, 260), 308 + rand(-30, 30), `hsl(${rand(0,360)|0},100%,75%)`);
    }
  } else if (lastScoreRank >= 0) {
    // made the leaderboard but didn't take #1 — still nice
    ctx.font = "bold 22px Trebuchet MS";
    ctx.fillStyle = "#ffe8a0";
    ctx.shadowColor = "#fa3";
    ctx.shadowBlur = 14;
    ctx.fillText(`✦  You ranked #${lastScoreRank + 1} on the leaderboard!  ✦`, W / 2, 300);
    ctx.shadowBlur = 0;
  }
  ctx.restore();

  // ===== Leaderboard panel (right side) =====
  drawHighScoresPanel(W - 280, H - 360, 250, 200);

  // ===== PLAY AGAIN button =====
  const bw = 320, bh = 78;
  const bx = W / 2 - bw / 2;
  const by = H - 130;
  winBtn.x = bx; winBtn.y = by; winBtn.w = bw; winBtn.h = bh;
  const hover = mouse.x >= bx && mouse.x <= bx + bw && mouse.y >= by && mouse.y <= by + bh;

  ctx.save();
  // pulsing magical halo around the button
  const bp = 0.5 + 0.5 * Math.sin(frame * 0.1);
  if (hover) {
    radialGlow(W / 2, by + bh / 2, 160, "rgba(255,200,80,0.7)");
    radialGlow(W / 2, by + bh / 2, 100, `hsla(${(frame * 4) % 360}, 100%, 75%, 0.6)`);
  } else {
    radialGlow(W / 2, by + bh / 2, 110, `hsla(${(frame * 3) % 360}, 100%, 70%, ${0.35 + bp * 0.3})`);
  }

  // gradient fill — gold/pink/cyan rainbow celebration button
  const bgrad = ctx.createLinearGradient(bx, by, bx + bw, by + bh);
  bgrad.addColorStop(0,   hover ? "#ffaa30" : "#ff8aff");
  bgrad.addColorStop(0.5, hover ? "#ff60aa" : "#9bffea");
  bgrad.addColorStop(1,   hover ? "#ffea60" : "#fffacc");
  ctx.fillStyle = bgrad;
  ctx.fillRect(bx, by, bw, bh);

  // double border (outer crisp + inner sparkle frame)
  ctx.strokeStyle = hover ? "#ffffff" : "#fffacc";
  ctx.lineWidth = 2.6;
  ctx.strokeRect(bx, by, bw, bh);
  ctx.strokeStyle = `hsla(${(frame * 4) % 360}, 100%, 80%, 0.85)`;
  ctx.lineWidth = 1;
  ctx.strokeRect(bx + 5, by + 5, bw - 10, bh - 10);

  ctx.font = "bold 32px Trebuchet MS";
  ctx.fillStyle = "#1a0030";
  ctx.textAlign = "center";
  ctx.shadowColor = "#fff";
  ctx.shadowBlur = hover ? 14 : 8;
  ctx.fillText("✨  PLAY AGAIN  ✨", W / 2, by + bh / 2 + 12);
  ctx.shadowBlur = 0;
  ctx.restore();

  // small hint
  ctx.save();
  ctx.font = "13px Trebuchet MS";
  ctx.fillStyle = "rgba(255,255,255,0.75)";
  ctx.textAlign = "center";
  ctx.fillText("Click PLAY AGAIN or press ENTER", W / 2, H - 30);
  ctx.restore();

  // continuous extra rainbow sparkles all over the screen for celebration
  if (frame % 2 === 0) {
    addSparkle(rand(0, W), rand(0, H), `hsl(${(Math.random() * 360) | 0}, 100%, 75%)`);
  }
  // bursts of rainbow particles around Inky every few frames
  if (frame % 8 === 0) {
    for (let k = 0; k < 6; k++) {
      const a = rand(0, TAU);
      const sp = rand(2, 5);
      particles.push({
        x: W / 2 + Math.cos(a) * 40,
        y: H / 2 + 60 + Math.sin(a) * 40,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 1.5,
        life: 50, max: 50, r: rand(2, 3.5),
        color: `hsl(${(frame * 5 + k * 60) % 360}, 100%, 65%)`
      });
    }
  }
}

/* ---------- Main loop ---------- */
function loop() {
  frame++;

  // SCREEN SHAKE — apply a small random offset while gameplay is rendering
  ctx.save();
  if (screenShake > 0) {
    const sa = screenShake * 0.55;
    ctx.translate(rand(-sa, sa), rand(-sa, sa));
    screenShake--;
  }

  drawBackground();
  updateAndDrawAmbience();
  updateAndDrawBubbles();

  if (state === "title") {
    drawTitle();
  } else if (state === "manual") {
    drawManual();
  } else if (state === "playing") {
    updatePlayer();
    updateProjectiles();
    updateMinions();
    if (boss) updateBoss();
    if (boss) drawWhale(boss);
    drawMinions();
    drawProjectiles();
    drawAndApplyWave();
    drawInky(player);
    // RED HIT TINT on Inky — pulses for the duration of playerHitFlash
    if (playerHitFlash > 0) {
      const flashA = playerHitFlash / 60;
      ctx.save();
      radialGlow(player.x, player.y, 70, `rgba(255,40,40,${0.85 * flashA})`);
      ctx.fillStyle = `rgba(255,40,40,${0.55 * flashA})`;
      ctx.beginPath();
      ctx.ellipse(player.x, player.y, 40, 30, 0, 0, TAU);
      ctx.fill();
      ctx.restore();
    }
    updateAndDrawParticles();
    updateAndDrawHurtFloaters();
  } else if (state === "levelcomplete") {
    if (boss) drawWhale(boss);
    drawMinions();
    drawProjectiles();
    drawInky(player);
    updateAndDrawParticles();
    updateAndDrawHurtFloaters();
  } else if (state === "gameover") {
    drawProjectiles();
    drawInky(player);
    updateAndDrawParticles();
    updateAndDrawHurtFloaters();
  } else if (state === "win") {
    // celebration Inky is drawn inside drawWin at center stage; just update particles here
    updateAndDrawParticles();
  }

  // unshake before HUD / overlays so the UI stays steady
  ctx.restore();

  if (state === "playing")             drawHUD();
  else if (state === "levelcomplete") { drawHUD(); drawLevelComplete(); }
  else if (state === "gameover")      { drawHUD(); drawGameOver(); }
  else if (state === "win")             drawWin();

  // RED PAIN VIGNETTE — dark red glow around the edges of the screen when hit
  if (playerHitFlash > 0) {
    const flashA = playerHitFlash / 60;
    const grad = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.28, W / 2, H / 2, Math.max(W, H) * 0.72);
    grad.addColorStop(0, "rgba(0,0,0,0)");
    grad.addColorStop(0.6, `rgba(120,0,0,${0.20 * flashA})`);
    grad.addColorStop(1, `rgba(180,0,0,${0.55 * flashA})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    playerHitFlash--;
  }

  requestAnimationFrame(loop);
}
loop();
</script>
