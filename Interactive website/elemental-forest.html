<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elemental Forest 🌿</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;700&family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: #020802; }
    body {
      color: white;
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }
    button { font-family: inherit; }
    canvas { display: block; }

    .screen { display: none; min-height: 100vh; padding: 16px; }
    .screen.active { display: block; }

    /* MAP */
    #screen-map { padding: 0; }
    #map-canvas { width: 100%; cursor: default; }

    .top-bar {
      position: absolute; top: 0; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 18px; pointer-events: none; z-index: 10;
    }
    .mats-pill {
      background: rgba(10,15,10,0.7);
      border: 1px solid rgba(100,200,100,0.25);
      border-radius: 999px;
      padding: 6px 12px;
      display: flex; gap: 10px;
      font-family: 'Press Start 2P', cursive;
      font-size: 0.42rem;
      color: #cceecc;
      pointer-events: auto;
      backdrop-filter: blur(4px);
    }
    .mats-pill span.count { color: #ffcc88; margin-left: 2px; }

    .forest-nav {
      display: flex; justify-content: center; gap: 14px;
      padding: 18px; flex-wrap: wrap;
    }
    .forest-nav-btn {
      background: #12122a;
      border: 2px solid rgba(100,200,100,0.3);
      border-radius: 30px;
      padding: 12px 22px;
      font-family: 'Press Start 2P', cursive;
      font-size: 0.42rem;
      color: #88ff88;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 0 15px rgba(100,200,100,0.1);
      line-height: 1.6;
    }
    .forest-nav-btn:hover {
      border-color: rgba(100,200,100,0.6);
      box-shadow: 0 0 25px rgba(100,200,100,0.3);
      transform: translateY(-2px);
    }
    .forest-nav-btn.danger {
      border-color: rgba(200,80,80,0.3);
      color: #ffaaaa;
      box-shadow: 0 0 15px rgba(200,80,80,0.1);
    }

    /* Generic screen content wrapper */
    .content {
      max-width: 760px; margin: 0 auto;
    }
    .back-btn {
      background: none;
      border: 2px solid rgba(150,150,150,0.3);
      border-radius: 20px;
      padding: 10px 18px;
      font-family: 'Press Start 2P', cursive;
      font-size: 0.38rem;
      color: #aaaacc;
      cursor: pointer;
      margin-bottom: 22px;
      transition: all 0.2s ease;
      line-height: 1.6;
    }
    .back-btn:hover { border-color: rgba(150,150,255,0.5); color: #ccccff; }

    .title-h {
      font-family: 'Press Start 2P', cursive;
      font-size: clamp(0.7rem, 3vw, 1.1rem);
      text-align: center; margin-bottom: 12px; line-height: 1.6;
    }
    .subtitle {
      font-family: 'Dancing Script', cursive;
      font-size: 1.3rem;
      color: rgba(255,255,255,0.8);
      text-align: center; margin-bottom: 22px; line-height: 1.6;
    }

    /* SEARCH */
    #search-canvas { width: 100%; max-width: 760px; border-radius: 14px; cursor: crosshair; }
    .search-hint {
      font-family: 'Dancing Script', cursive;
      font-size: 1.15rem;
      color: rgba(255,255,255,0.7);
      text-align: center; margin-top: 12px;
    }

    /* BUILD HOME */
    .materials-bar {
      display: flex; flex-wrap: wrap; gap: 8px;
      justify-content: center; margin: 14px 0 8px;
    }
    .material-chip {
      background: rgba(20,20,40,0.7);
      border: 1px solid rgba(200,200,255,0.2);
      border-radius: 999px;
      padding: 6px 12px;
      display: flex; align-items: center; gap: 6px;
      font-family: 'Press Start 2P', cursive;
      font-size: 0.42rem;
      color: #cceeff;
    }
    .material-chip .material-count {
      color: #ffcc88; min-width: 14px; text-align: right;
    }
    #room-canvas { background: #050510; }
    .furniture-title {
      font-family: 'Press Start 2P', cursive;
      font-size: 0.5rem; text-align: center; margin: 14px 0;
      color: #ccccee; line-height: 1.5;
    }
    .furniture-shop {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px; margin-bottom: 20px;
    }
    .furniture-card {
      background: #12122a;
      border: 2px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 14px 8px;
      text-align: center;
      cursor: grab;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      user-select: none;
    }
    .furniture-card:active { cursor: grabbing; }
    .furniture-card:hover:not(.built):not(.cant-afford) { transform: translateY(-3px); }
    .furniture-card.built { cursor: default; opacity: 0.85; }
    .furniture-card.cant-afford { cursor: not-allowed; opacity: 0.45; }
    .furniture-emoji { font-size: 2rem; margin-bottom: 6px; }
    .furniture-name {
      font-family: 'Press Start 2P', cursive;
      font-size: 0.4rem; margin-bottom: 6px; line-height: 1.5;
    }
    .furniture-cost {
      font-family: 'Press Start 2P', cursive;
      font-size: 0.4rem; color: #aaaacc; line-height: 1.6;
    }
    .adopt-ready-text {
      font-family: 'Press Start 2P', cursive;
      font-size: 0.7rem; color: #ffcc44; text-align: center;
      text-shadow: 0 0 15px rgba(255,204,68,0.6);
      margin: 16px 0;
    }
    .adopt-btn-big {
      display: block; margin: 0 auto;
      background: linear-gradient(135deg, #ffcc44, #ff44cc);
      border: none; border-radius: 30px;
      padding: 18px 36px;
      font-family: 'Press Start 2P', cursive;
      font-size: 0.6rem; color: white;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(255,200,80,0.4);
      transition: transform 0.2s ease;
      line-height: 1.6;
    }
    .adopt-btn-big:hover { transform: translateY(-3px) scale(1.03); }

    /* ADOPT */
    #adopt-canvas { width: 100%; max-width: 760px; border-radius: 14px; cursor: pointer; margin: 0 auto; }

    /* PATH */
    #path-canvas { width: 100%; max-width: 900px; border-radius: 14px; cursor: pointer; margin: 0 auto; }

    /* ADVENTURE */
    .adv-header {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; flex-wrap: wrap; margin-bottom: 12px;
    }
    .adv-score {
      font-family: 'Press Start 2P', cursive;
      font-size: 0.5rem; color: #ffcc44;
      background: rgba(20,20,40,0.7);
      border: 1px solid rgba(255,204,68,0.3);
      border-radius: 12px; padding: 8px 14px;
      line-height: 1.6;
    }
    #adventure-canvas { width: 100%; max-width: 760px; border-radius: 14px; cursor: pointer; margin: 0 auto; background: #050510; }
    .adv-reward {
      text-align: center; margin-top: 16px;
      font-family: 'Dancing Script', cursive;
      font-size: 1.4rem; color: #ffcc88;
    }

    /* HOME VIEW */
    #homeview-canvas { width: 100%; max-width: 760px; border-radius: 14px; background: #050510; }
    .home-stats {
      display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 14px;
    }
    .home-stat {
      background: rgba(20,20,40,0.7);
      border: 1px solid rgba(200,200,255,0.2);
      border-radius: 14px;
      padding: 10px 16px;
      text-align: center;
    }
    .home-stat .lbl {
      display: block;
      font-family: 'Press Start 2P', cursive;
      font-size: 0.4rem; color: #6666aa; margin-bottom: 6px;
      line-height: 1.5;
    }
    .home-stat .val {
      font-family: 'Press Start 2P', cursive;
      font-size: 0.55rem; color: #ffcc88; line-height: 1.5;
    }
    .home-actions { display: flex; gap: 12px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
    .home-action {
      background: linear-gradient(135deg, #44aaff, #8844ff);
      border: none; border-radius: 24px;
      padding: 12px 22px;
      font-family: 'Press Start 2P', cursive;
      font-size: 0.45rem; color: white; cursor: pointer;
      box-shadow: 0 0 15px rgba(80,120,255,0.3);
      line-height: 1.6;
    }
    .home-action:hover { transform: translateY(-2px); }

    /* BREEDING */
    .breed-instructions {
      font-family: 'Dancing Script', cursive;
      font-size: 1.2rem; color: #ffcc88; text-align: center; margin-bottom: 16px;
    }
    .breed-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 12px; margin-bottom: 20px;
    }
    .breed-card {
      background: #12122a;
      border: 2px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 14px 8px; text-align: center;
      cursor: pointer; transition: all 0.15s ease;
    }
    .breed-card.selected { transform: translateY(-3px); }
    .breed-emoji { font-size: 2.4rem; margin-bottom: 6px; }
    .breed-name {
      font-family: 'Press Start 2P', cursive;
      font-size: 0.42rem; line-height: 1.5;
    }
    .breed-cost {
      text-align: center;
      font-family: 'Press Start 2P', cursive;
      font-size: 0.45rem; color: #ffcc44; line-height: 1.6;
      margin-bottom: 14px;
    }
    .breed-btn {
      display: block; margin: 0 auto;
      background: linear-gradient(135deg, #ff44cc, #44aaff);
      border: none; border-radius: 24px;
      padding: 14px 26px;
      font-family: 'Press Start 2P', cursive;
      font-size: 0.55rem; color: white; cursor: pointer;
      box-shadow: 0 0 20px rgba(255,80,200,0.3);
      line-height: 1.6;
    }
    .breed-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .babies-section { margin-top: 30px; }
    .babies-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
    }
    .baby-card {
      background: #12122a;
      border: 2px solid rgba(255,180,255,0.3);
      border-radius: 14px;
      padding: 14px 8px; text-align: center;
      box-shadow: 0 0 14px rgba(255,180,255,0.15);
    }
    .baby-emoji { font-size: 2.2rem; margin-bottom: 6px; }
    .baby-name {
      font-family: 'Press Start 2P', cursive;
      font-size: 0.4rem; color: #ff88ee; line-height: 1.5;
    }
    .baby-parents {
      font-family: 'Nunito'; font-size: 0.8rem; color: #aaaacc; margin-top: 6px;
    }

    /* COLLECTION */
    .collection-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
    }
    .collection-card {
      background: #12122a;
      border: 2px solid transparent;
      border-radius: 18px;
      padding: 20px 14px;
      text-align: center;
      transition: transform 0.2s ease;
    }
    .collection-card:hover { transform: translateY(-4px); }
    .coll-emoji { font-size: 2.6rem; margin-bottom: 8px; }
    .coll-pet {
      font-family: 'Press Start 2P', cursive;
      font-size: 0.5rem; line-height: 1.5; margin-bottom: 6px;
    }
    .coll-meta {
      font-family: 'Nunito', sans-serif;
      font-size: 0.85rem; color: #aaaacc; line-height: 1.5;
    }
    .coll-path {
      margin-top: 8px;
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-family: 'Press Start 2P', cursive;
      font-size: 0.36rem;
      line-height: 1.5;
    }
    .coll-hint {
      font-family: 'Dancing Script', cursive;
      font-size: 1.2rem; color: #aaffaa;
      text-align: center; margin-top: 20px;
    }

    /* Toast */
    #toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #12122a; border: 2px solid #88ff88;
      border-radius: 14px; padding: 14px 22px;
      font-family: 'Press Start 2P', cursive;
      font-size: 0.42rem; color: #88ff88;
      text-align: center; line-height: 1.6;
      box-shadow: 0 0 20px rgba(100,255,100,0.3);
      z-index: 9999; max-width: 80vw; opacity: 0;
      pointer-events: none; transition: opacity 0.3s ease, transform 0.3s ease;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }

    @media (max-width: 600px) {
      .forest-nav { padding: 12px; gap: 8px; }
      .forest-nav-btn { padding: 10px 14px; font-size: 0.38rem; }
      .mats-pill { font-size: 0.36rem; gap: 8px; }
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.05); }
    }

    .breed-card .age-bar {
      font-family: 'Nunito', sans-serif;
      font-size: 0.75rem;
      color: #aaaacc;
      margin-top: 4px;
    }
    .breed-card.ready { box-shadow: 0 0 14px rgba(100,255,180,0.25); }
    .breed-card.not-ready { opacity: 0.55; cursor: not-allowed; }
  </style>
</head>
<body>

<!-- TOAST -->
<div id="toast"></div>

<main id="game">

  <!-- MAP -->
  <section id="screen-map" class="screen active">
    <div class="top-bar">
      <div></div>
      <div class="mats-pill" id="map-mats"></div>
    </div>
    <canvas id="map-canvas"></canvas>
    <nav class="forest-nav">
      <button class="forest-nav-btn" onclick="showScreen(SCREENS.COLLECTION)">✦ MY PETS</button>
      <button class="forest-nav-btn" onclick="showScreen(SCREENS.BREEDING)">🥚 BREEDING</button>
      <button class="forest-nav-btn" onclick="collectMaterials()" style="border-color:rgba(255,204,68,0.3);color:#ffcc44">✦ FORAGE FOR MATERIALS</button>
      <button class="forest-nav-btn danger" onclick="resetForest()">↻ RESET</button>
    </nav>
  </section>

  <!-- SEARCH -->
  <section id="screen-search" class="screen">
    <div class="content">
      <button class="back-btn" onclick="showScreen(SCREENS.MAP)">← BACK TO MAP</button>
      <p class="title-h" id="search-title"></p>
      <p class="subtitle" id="search-desc"></p>
      <canvas id="search-canvas" width="760" height="500"></canvas>
      <p class="search-hint" id="search-hint"></p>
    </div>
  </section>

  <!-- BUILD HOME -->
  <section id="screen-build" class="screen">
    <div class="content">
      <button class="back-btn" onclick="showScreen(SCREENS.MAP)">← BACK TO MAP</button>
      <p class="title-h" id="build-title"></p>
      <p class="subtitle">"Build a home for your new friend before adopting them!!"</p>
      <div class="materials-bar" id="materials-bar"></div>
      <canvas id="room-canvas" width="760" height="380" style="width:100%;border-radius:16px;margin:14px 0"></canvas>
      <p class="furniture-title">✦ DRAG OR TAP FURNITURE TO ADD IT ✦</p>
      <div class="furniture-shop" id="furniture-shop"></div>
      <div id="adopt-ready" style="display:none">
        <p class="adopt-ready-text">🌟 HOME IS READY!! 🌟</p>
        <button class="adopt-btn-big" onclick="startAdoption()">✨ ADOPT YOUR PET!! ✨</button>
      </div>
    </div>
  </section>

  <!-- ADOPT -->
  <section id="screen-adopt" class="screen">
    <div class="content">
      <canvas id="adopt-canvas" width="760" height="520"></canvas>
    </div>
  </section>

  <!-- PATH -->
  <section id="screen-path" class="screen">
    <div class="content">
      <canvas id="path-canvas" width="900" height="500"></canvas>
    </div>
  </section>

  <!-- ADVENTURE -->
  <section id="screen-adventure" class="screen">
    <div class="content">
      <div class="adv-header">
        <button class="back-btn" style="margin:0" onclick="exitAdventure()">← END ADVENTURE</button>
        <div class="adv-score" id="adv-score"></div>
      </div>
      <p class="title-h" id="adv-title"></p>
      <p class="subtitle" id="adv-desc"></p>
      <canvas id="adventure-canvas" width="760" height="500"></canvas>
      <p class="adv-reward" id="adv-reward"></p>
    </div>
  </section>

  <!-- HOME VIEW -->
  <section id="screen-homeview" class="screen">
    <div class="content">
      <button class="back-btn" onclick="showScreen(SCREENS.MAP)">← BACK TO MAP</button>
      <p class="title-h" id="hv-title"></p>
      <p class="subtitle" id="hv-subtitle"></p>
      <canvas id="homeview-canvas" width="760" height="420"></canvas>
      <div class="home-stats" id="hv-stats"></div>
      <div class="home-actions">
        <button class="home-action" onclick="startAdventureFromHome()">⚔️ GO ON ADVENTURE!!</button>
        <button class="home-action" onclick="changePath()">✨ CHANGE PATH</button>
      </div>
    </div>
  </section>

  <!-- BREEDING -->
  <section id="screen-breeding" class="screen">
    <div class="content">
      <button class="back-btn" onclick="showScreen(SCREENS.MAP)">← BACK TO MAP</button>
      <p class="title-h" style="color:#ff88ee">🥚 BREEDING NEST</p>
      <p class="subtitle">"Two elements join to make a new magical baby!!"</p>
      <p class="breed-instructions" id="breed-instructions"></p>
      <p class="title-h" style="font-size:0.6rem;margin-bottom:10px">CHOOSE TWO PARENTS</p>
      <div class="breed-grid" id="breed-parents"></div>
      <div id="breeding-result" style="margin-top:18px"></div>
      <div class="babies-section">
        <p class="title-h" style="font-size:0.6rem;color:#ff88ee">YOUR BABIES</p>
        <div class="babies-grid" id="babies-grid"></div>
      </div>
    </div>
  </section>

  <!-- COLLECTION -->
  <section id="screen-collection" class="screen">
    <div class="content">
      <button class="back-btn" onclick="showScreen(SCREENS.MAP)">← BACK TO MAP</button>
      <p class="title-h" style="color:#88ff88">✦ MY PETS ✦</p>
      <p class="subtitle">"Your elemental companions"</p>
      <div class="collection-grid" id="collection-grid"></div>
      <p class="coll-hint" id="collection-hint"></p>
    </div>
  </section>

</main>

<script>
// ============================================================
// GAME STATE
// ============================================================
const defaultState = {
  adoptedPets: [],
  petAges: {},
  petPaths: {},
  builtHomes: {},
  materials: {
    rainbowDust: 5,
    magicalWater: 5,
    fireCrystals: 5,
    shapeshiftingFlowers: 5,
    cloudInBottle: 5,
  },
  forestMaterials: [],
  adventuresCompleted: {},
  babies: [],
  foundPets: [],
  lastMaterialSpawn: 0,
};

function loadState() {
  try {
    const raw = localStorage.getItem('elementalForestState');
    if (!raw) return JSON.parse(JSON.stringify(defaultState));
    const parsed = JSON.parse(raw);
    // Merge with defaults so new fields stay present
    return {
      ...JSON.parse(JSON.stringify(defaultState)),
      ...parsed,
      materials: { ...defaultState.materials, ...(parsed.materials || {}) },
    };
  } catch (_) {
    return JSON.parse(JSON.stringify(defaultState));
  }
}

function saveState() {
  localStorage.setItem('elementalForestState', JSON.stringify(gameState));
}

let gameState = loadState();

// ============================================================
// AREA DATA
// ============================================================
const areaData = {
  fire: {
    id: 'fire', name: 'FIRE AREA', pet: 'Red', petEmoji: '🔥',
    color: '#ff4422', glow: '#ff2200', bgColor: '#1a0500',
    treeColors: ['#cc2200','#aa1100','#dd3300','#bb2200'],
    floatEmoji: '✦', floatColor: '#ff8844',
    adoptMessage: 'Red jumps into your arms leaving tiny warm pawprints!! 🔥',
    primaryMat: 'fireCrystals',
  },
  water: {
    id: 'water', name: 'WATER AREA', pet: 'Wave', petEmoji: '🦑',
    color: '#2244ff', glow: '#0022ff', bgColor: '#000a1a',
    treeColors: ['#1133cc','#0022aa','#2244dd','#1133bb'],
    floatEmoji: '💧', floatColor: '#44aaff',
    adoptMessage: 'Wave wraps tiny tentacles around your finger!! 🦑',
    primaryMat: 'magicalWater',
  },
  wind: {
    id: 'wind', name: 'WIND AREA', pet: 'Wind', petEmoji: '🐉',
    color: '#eeeeff', glow: '#ccccff', bgColor: '#0a0a1a',
    treeColors: ['#aaaacc','#888899','#ccccee','#bbbbdd'],
    floatEmoji: '☁️', floatColor: '#ffffff',
    adoptMessage: 'Wind lands on your shoulder and immediately looks upward!! 🐉',
    primaryMat: 'cloudInBottle',
  },
  earth: {
    id: 'earth', name: 'EARTH AREA', pet: 'Uni', petEmoji: '🦊',
    color: '#44cc44', glow: '#22aa22', bgColor: '#051005',
    treeColors: ['#228822','#1a6618','#2a9928','#1e7720'],
    floatEmoji: '✿', floatColor: '#88ff88',
    adoptMessage: 'Uni nuzzles your hand and a tiny flower appears!! 🦊',
    primaryMat: 'shapeshiftingFlowers',
  },
  rainbow: {
    id: 'rainbow', name: 'RAINBOW CENTER', pet: 'Element', petEmoji: '🌈',
    color: '#ffcc44', glow: '#ff88cc', bgColor: '#0a0a0a',
    treeColors: ['#ff4444','#ffcc44','#44cc44','#4488ff','#8844ff','#ff44cc'],
    floatEmoji: '🌟', floatColor: '#ffffff',
    adoptMessage: 'Element glides toward you leaving a rainbow trail!! You have been chosen!! 🌈',
    primaryMat: 'rainbowDust',
  },
};

const materialEmojis = {
  rainbowDust: '🌈',
  magicalWater: '💧',
  fireCrystals: '🔥',
  shapeshiftingFlowers: '🌸',
  cloudInBottle: '☁️',
};
const materialNames = {
  rainbowDust: 'Rainbow Dust',
  magicalWater: 'Magical Water',
  fireCrystals: 'Fire Crystals',
  shapeshiftingFlowers: 'Shapeshifting Flowers',
  cloudInBottle: 'Cloud in a Bottle',
};

// ============================================================
// SCREEN MANAGER
// ============================================================
const SCREENS = {
  MAP: 'map', SEARCH: 'search', BUILD: 'build', ADOPT: 'adopt',
  PATH: 'path', ADVENTURE: 'adventure', HOMEVIEW: 'homeview',
  BREEDING: 'breeding', COLLECTION: 'collection',
};
const SCREEN_IDS = {
  map: 'screen-map', search: 'screen-search', build: 'screen-build',
  adopt: 'screen-adopt', path: 'screen-path', adventure: 'screen-adventure',
  homeview: 'screen-homeview', breeding: 'screen-breeding', collection: 'screen-collection',
};

let currentScreen = SCREENS.MAP;
let currentArea = null;
let frame = 0;

function showScreen(screen, area = null) {
  currentScreen = screen;
  currentArea = area;
  Object.values(SCREEN_IDS).forEach(id => {
    document.getElementById(id).classList.remove('active');
  });
  document.getElementById(SCREEN_IDS[screen]).classList.add('active');
  window.scrollTo({ top: 0, behavior: 'instant' });

  if (screen === SCREENS.MAP) resizeMapCanvas();
  if (screen === SCREENS.SEARCH) initSearch(area);
  if (screen === SCREENS.BUILD) initBuild(area);
  if (screen === SCREENS.ADOPT) initAdopt(area);
  if (screen === SCREENS.PATH) initPath(area);
  if (screen === SCREENS.ADVENTURE) initAdventure(area);
  if (screen === SCREENS.HOMEVIEW) initHomeView(area);
  if (screen === SCREENS.BREEDING) initBreeding();
  if (screen === SCREENS.COLLECTION) initCollection();
}

// ============================================================
// TOAST
// ============================================================
let toastTimer = null;
function toast(text, color = '#88ff88') {
  const el = document.getElementById('toast');
  el.textContent = text;
  el.style.color = color;
  el.style.borderColor = color;
  el.style.boxShadow = `0 0 20px ${color}55`;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

// ============================================================
// MAP CANVAS
// ============================================================
const mapCanvas = document.getElementById('map-canvas');
const mapCtx = mapCanvas.getContext('2d');

function resizeMapCanvas() {
  mapCanvas.width = mapCanvas.offsetWidth || window.innerWidth;
  mapCanvas.height = 600;
}
resizeMapCanvas();
window.addEventListener('resize', () => {
  if (currentScreen === SCREENS.MAP) resizeMapCanvas();
});

function getMapAreas() {
  const W = mapCanvas.width, H = mapCanvas.height;
  return [
    { ...areaData.fire,    x: W*0.15, y: H*0.35, r: W*0.13 },
    { ...areaData.water,   x: W*0.85, y: H*0.35, r: W*0.13 },
    { ...areaData.wind,    x: W*0.15, y: H*0.72, r: W*0.13 },
    { ...areaData.earth,   x: W*0.85, y: H*0.72, r: W*0.13 },
    { ...areaData.rainbow, x: W*0.5,  y: H*0.52, r: W*0.15 },
  ];
}

let hoveredArea = null;

function drawDetailedMap(ctx, W, H, frameCount, state, hoveredArea) {
  // Rich gradient background
  const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#020a02');
  bgGrad.addColorStop(0.4, '#051005');
  bgGrad.addColorStop(1, '#030803');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // Moon
  ctx.fillStyle = 'rgba(220,220,180,0.9)';
  ctx.shadowColor = 'rgba(220,220,180,0.4)';
  ctx.shadowBlur = 30;
  ctx.beginPath();
  ctx.arc(W * 0.5, 45, 25, 0, Math.PI * 2);
  ctx.fill();
  // Moon craters
  ctx.fillStyle = 'rgba(180,180,150,0.6)';
  ctx.shadowBlur = 0;
  [[W*0.495,40,4],[W*0.51,48,3],[W*0.49,50,2]].forEach(([cx,cy,cr]) => {
    ctx.beginPath(); ctx.arc(cx,cy,cr,0,Math.PI*2); ctx.fill();
  });

  // Twinkling stars
  for (let s = 0; s < 120; s++) {
    const sx = (s * 173 + 47) % W;
    const sy = (s * 97 + 23) % (H * 0.45);
    const alpha = 0.15 + Math.sin(frameCount * 0.03 + s * 0.7) * 0.12;
    const size = 0.5 + (s % 3) * 0.4;
    ctx.fillStyle = `rgba(255,255,220,${alpha})`;
    ctx.beginPath();
    ctx.arc(sx, sy, size, 0, Math.PI * 2);
    ctx.fill();
  }

  // Ground fog
  const fogGrad = ctx.createLinearGradient(0, H * 0.75, 0, H);
  fogGrad.addColorStop(0, 'transparent');
  fogGrad.addColorStop(1, 'rgba(20,40,20,0.6)');
  ctx.fillStyle = fogGrad;
  ctx.fillRect(0, H * 0.75, W, H * 0.25);

  // Drifting fireflies
  for (let f = 0; f < 25; f++) {
    const fx = (f * 97 + frameCount * (0.3 + f * 0.02)) % W;
    const fy = H * 0.3 + ((f * 67 + frameCount * (0.15 + f * 0.01)) % (H * 0.5));
    const alpha = 0.2 + Math.sin(frameCount * 0.08 + f * 1.3) * 0.18;
    const colors = ['#88ff88','#ffff88','#88ffcc','#ffcc88','#aaffaa'];
    ctx.globalAlpha = alpha;
    ctx.fillStyle = colors[f % 5];
    ctx.shadowColor = colors[f % 5];
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(fx, fy, 1.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  }

  // Background depth trees
  for (let bt = 0; bt < 40; bt++) {
    const btx = (bt * 89 + 20) % W;
    const bty = H * 0.45 + (bt % 5) * 18;
    const bth = 35 + bt % 25;
    const btw = 12 + bt % 8;
    ctx.fillStyle = 'rgba(10,25,10,0.85)';
    ctx.beginPath();
    ctx.moveTo(btx, bty - bth);
    ctx.lineTo(btx - btw, bty + 5);
    ctx.lineTo(btx + btw, bty + 5);
    ctx.closePath();
    ctx.fill();
  }

  // Mushrooms
  const mushroomSpots = [[W*0.3,H*0.78],[W*0.45,H*0.82],[W*0.6,H*0.8],[W*0.2,H*0.85],[W*0.75,H*0.83],[W*0.55,H*0.86],[W*0.38,H*0.88]];
  mushroomSpots.forEach(([mx,my],mi) => {
    const mColors = ['#ff4444','#ff8844','#ffcc44','#44cc44','#cc44ff','#44ccff','#ff44cc'];
    ctx.fillStyle = '#5a3010';
    ctx.fillRect(mx-3, my, 6, 12);
    ctx.fillStyle = mColors[mi % mColors.length];
    ctx.shadowColor = mColors[mi % mColors.length]; ctx.shadowBlur = 5;
    ctx.beginPath();
    ctx.ellipse(mx, my, 10, 7, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    [[mx-4,my-1],[mx,my-3],[mx+3,my-1]].forEach(([dx,dy]) => {
      ctx.beginPath(); ctx.arc(dx,dy,1.5,0,Math.PI*2); ctx.fill();
    });
    ctx.shadowBlur = 0;
  });

  // Winding paths
  ctx.strokeStyle = 'rgba(80,120,80,0.25)';
  ctx.lineWidth = 8;
  ctx.setLineDash([12,8]);
  ctx.lineCap = 'round';
  const centerX = W * 0.5, centerY = H * 0.52;
  [[W*0.15, H*0.35],[W*0.85, H*0.35],[W*0.15, H*0.72],[W*0.85, H*0.72]].forEach(([ax,ay]) => {
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.bezierCurveTo(
      ax + (centerX-ax)*0.4, ay + (centerY-ay)*0.2,
      centerX - (centerX-ax)*0.3, centerY - (centerY-ay)*0.3,
      centerX, centerY
    );
    ctx.stroke();
  });
  ctx.setLineDash([]);

  // Areas
  const areas = getMapAreas();
  areas.forEach(area => {
    const isAdopted = state.adoptedPets.includes(area.id);
    const isHovered = hoveredArea === area.id;
    const isLocked = area.id === 'rainbow' &&
      !['fire','water','wind','earth'].every(p => state.adoptedPets.includes(p));
    const scale = isHovered ? 1.06 : 1;

    ctx.save();
    ctx.translate(area.x, area.y);
    ctx.scale(scale, scale);

    // Ground glow
    const groundGrad = ctx.createRadialGradient(0,0,10,0,0,area.r);
    if (isLocked) {
      groundGrad.addColorStop(0, 'rgba(30,30,30,0.5)');
      groundGrad.addColorStop(1, 'transparent');
    } else {
      groundGrad.addColorStop(0, area.color + '44');
      groundGrad.addColorStop(0.6, area.color + '11');
      groundGrad.addColorStop(1, 'transparent');
    }
    ctx.fillStyle = groundGrad;
    ctx.beginPath(); ctx.arc(0,0,area.r,0,Math.PI*2); ctx.fill();

    // Trees ring
    const treeCount = area.id === 'rainbow' ? 18 : 14;
    const rainbowTreeColors = ['#ff4444','#ff8844','#ffcc44','#44cc44','#4488ff','#8844ff','#ff44cc','#ff4488','#44ffcc','#ffaacc'];
    for (let t = 0; t < treeCount; t++) {
      const ta = (t / treeCount) * Math.PI * 2 - Math.PI/2;
      const tr = area.r * 0.7;
      const tx = Math.cos(ta) * tr;
      const ty = Math.sin(ta) * tr;
      const tHeight = 32 + (t % 4) * 10;
      const tWidth = 14 + (t % 3) * 4;
      const sway = Math.sin(frameCount * 0.02 + t * 0.5) * 2.5;

      ctx.fillStyle = isLocked ? '#1a1a1a' : '#3a2010';
      ctx.fillRect(tx + sway - 3, ty - 2, 6, 16);

      for (let layer = 0; layer < 3; layer++) {
        const layerY = ty - tHeight * 0.3 - layer * tHeight * 0.25;
        const layerW = tWidth * (1 - layer * 0.2);
        if (area.id === 'rainbow') {
          ctx.fillStyle = isLocked ? '#222222' : rainbowTreeColors[(t + layer) % rainbowTreeColors.length];
        } else {
          ctx.fillStyle = isLocked ? '#222222' : area.treeColors[t % area.treeColors.length];
        }
        ctx.shadowColor = isLocked ? '#222222' : area.color;
        ctx.shadowBlur = isHovered ? 12 : 5;
        ctx.beginPath();
        ctx.moveTo(tx + sway, layerY - tHeight * 0.35);
        ctx.lineTo(tx + sway - layerW/2, layerY + 4);
        ctx.lineTo(tx + sway + layerW/2, layerY + 4);
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      if (!isLocked && Math.sin(frameCount * 0.05 + t * 1.2) > 0.7) {
        const dotColors = area.id === 'rainbow'
          ? ['#ff4444','#ffcc44','#44ff44','#4488ff','#ff44cc']
          : [area.floatColor];
        ctx.fillStyle = dotColors[t % dotColors.length];
        ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(tx + sway + (t%3-1)*5, ty - tHeight*0.5, 2.5, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    // Floating elements
    for (let fe = 0; fe < 5; fe++) {
      const fea = (fe/5)*Math.PI*2 + frameCount*0.015;
      const fer = area.r * 0.5;
      const fex = Math.cos(fea) * fer;
      const fey = Math.sin(fea) * fer * 0.6;
      const alpha = isLocked ? 0 : 0.3 + Math.sin(frameCount*0.04+fe)*0.2;
      ctx.globalAlpha = alpha;
      ctx.font = '12px serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(area.floatEmoji, fex, fey);
      ctx.globalAlpha = 1;
    }

    // Center clearing
    const clearGrad = ctx.createRadialGradient(0,0,5,0,0,40);
    if (isLocked) {
      clearGrad.addColorStop(0, '#1a1a1a');
      clearGrad.addColorStop(1, '#0a0a0a');
    } else if (area.id === 'rainbow') {
      clearGrad.addColorStop(0, '#ffffff44');
      clearGrad.addColorStop(0.5, '#ffcc4433');
      clearGrad.addColorStop(1, '#ff44cc22');
    } else {
      clearGrad.addColorStop(0, area.color + '88');
      clearGrad.addColorStop(1, area.color + '22');
    }
    ctx.fillStyle = clearGrad;
    ctx.shadowColor = isLocked ? '#333333' : area.glow;
    ctx.shadowBlur = isHovered ? 30 : 15;
    ctx.beginPath(); ctx.arc(0,0,40,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;

    // Center emoji
    ctx.font = '26px serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (isLocked) ctx.fillText('🔒', 0, -5);
    else if (isAdopted) {
      ctx.fillText('✅', 0, -12);
      ctx.font = '18px serif';
      ctx.fillText(area.petEmoji, 0, 10);
    } else ctx.fillText(area.petEmoji, 0, -3);

    // Area name
    ctx.font = '7px "Press Start 2P", monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = isLocked ? '#333333' : area.color;
    ctx.shadowColor = isLocked ? 'transparent' : area.color;
    ctx.shadowBlur = 6;
    ctx.fillText(area.name, 0, 55);
    ctx.shadowBlur = 0;

    // Status text
    ctx.font = '6px "Press Start 2P", monospace';
    ctx.fillStyle = 'rgba(200,200,200,0.7)';
    if (!isLocked) {
      const homeBuilt = state.builtHomes[area.id];
      const allBuilt = homeBuilt && ['bed','lamp','bookshelf','memoryJar'].every(k => homeBuilt[k]);
      if (isAdopted) {
        ctx.fillStyle = area.color;
        ctx.fillText(area.pet + ' ✓ (TAP)', 0, 67);
      } else if (allBuilt) {
        ctx.fillStyle = '#ffcc44';
        ctx.fillText('HOME READY!! ADOPT!!', 0, 67);
      } else if (state.foundPets && state.foundPets.includes(area.id)) {
        ctx.fillStyle = '#ffaa88';
        ctx.fillText('BUILD HOME FIRST!!', 0, 67);
      } else {
        ctx.fillText('TAP TO SEARCH!!', 0, 67);
      }
    }

    // Hover ring
    if (isHovered && !isLocked) {
      ctx.strokeStyle = area.color;
      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.4 + Math.sin(frameCount*0.08)*0.2;
      ctx.setLineDash([6,4]);
      ctx.beginPath(); ctx.arc(0,0,48,0,Math.PI*2); ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
    }

    ctx.restore();
  });

  // Forest materials
  if (state.forestMaterials) {
    state.forestMaterials.forEach(mat => {
      const x = mat.x * W;
      const y = mat.y * H + Math.sin(frameCount*0.04 + mat.seed)*4;
      const alpha = 0.75 + Math.sin(frameCount*0.05 + mat.seed)*0.2;
      ctx.globalAlpha = alpha;
      // Glow halo
      const halo = ctx.createRadialGradient(x,y,2,x,y,16);
      halo.addColorStop(0, '#ffffff66');
      halo.addColorStop(1, 'transparent');
      ctx.fillStyle = halo;
      ctx.beginPath(); ctx.arc(x,y,16,0,Math.PI*2); ctx.fill();
      // Emoji
      ctx.font = '18px serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(materialEmojis[mat.type] || '✦', x, y);
      ctx.globalAlpha = 1;
    });
  }

  // Title
  ctx.font = 'bold 16px "Press Start 2P", monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#88ff88';
  ctx.shadowColor = '#44ff44'; ctx.shadowBlur = 15;
  ctx.fillText('ELEMENTAL FOREST', W/2, 32);
  ctx.shadowBlur = 0;
  ctx.font = '14px "Dancing Script", cursive';
  ctx.fillStyle = 'rgba(150,220,150,0.6)';
  ctx.fillText('"Five elements. Five pets. One magical forest."', W/2, 52);
}

// Map interactions
function getMapTargetAt(x, y) {
  // Material clicked?
  const W = mapCanvas.width, H = mapCanvas.height;
  for (let i = 0; i < gameState.forestMaterials.length; i++) {
    const mat = gameState.forestMaterials[i];
    const mx = mat.x * W, my = mat.y * H;
    if (Math.hypot(x - mx, y - my) < 22) return { kind: 'material', index: i };
  }
  // Area clicked?
  const areas = getMapAreas();
  for (let area of areas) {
    if (Math.hypot(x - area.x, y - area.y) < area.r) return { kind: 'area', id: area.id };
  }
  return null;
}

mapCanvas.addEventListener('mousemove', (e) => {
  const rect = mapCanvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (mapCanvas.width / rect.width);
  const y = (e.clientY - rect.top) * (mapCanvas.height / rect.height);
  const tgt = getMapTargetAt(x, y);
  if (tgt && tgt.kind === 'area') {
    hoveredArea = tgt.id;
    mapCanvas.style.cursor = 'pointer';
  } else if (tgt && tgt.kind === 'material') {
    hoveredArea = null;
    mapCanvas.style.cursor = 'grab';
  } else {
    hoveredArea = null;
    mapCanvas.style.cursor = 'default';
  }
});
mapCanvas.addEventListener('mouseleave', () => { hoveredArea = null; });

function handleMapClick(x, y) {
  const tgt = getMapTargetAt(x, y);
  if (!tgt) return;
  if (tgt.kind === 'material') {
    const mat = gameState.forestMaterials[tgt.index];
    gameState.materials[mat.type] = (gameState.materials[mat.type] || 0) + 1;
    gameState.forestMaterials.splice(tgt.index, 1);
    saveState();
    updateTopMats();
    toast(`+1 ${materialNames[mat.type]}!!`, '#ffcc88');
    return;
  }
  if (tgt.kind === 'area') {
    visitArea(tgt.id);
  }
}

mapCanvas.addEventListener('click', (e) => {
  const rect = mapCanvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (mapCanvas.width / rect.width);
  const y = (e.clientY - rect.top) * (mapCanvas.height / rect.height);
  handleMapClick(x, y);
});
mapCanvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const rect = mapCanvas.getBoundingClientRect();
  const touch = e.touches[0];
  const x = (touch.clientX - rect.left) * (mapCanvas.width / rect.width);
  const y = (touch.clientY - rect.top) * (mapCanvas.height / rect.height);
  handleMapClick(x, y);
}, { passive: false });

function visitArea(areaId) {
  const isAdopted = gameState.adoptedPets.includes(areaId);
  const isLocked = areaId === 'rainbow' &&
    !['fire','water','wind','earth'].every(p => gameState.adoptedPets.includes(p));
  if (isLocked) {
    toast('Adopt all four elemental pets first!!', '#ffcc44');
    return;
  }

  const homeBuilt = gameState.builtHomes[areaId] || {};
  const allBuilt = ['bed','lamp','bookshelf','memoryJar'].every(k => homeBuilt[k]);

  if (isAdopted && allBuilt) {
    // Home built — go to home view (which has Adventure button)
    showScreen(SCREENS.HOMEVIEW, areaId);
    return;
  }
  if (isAdopted && !allBuilt) {
    // Adopted but home not built — let her build it now!!
    showScreen(SCREENS.BUILD, areaId);
    return;
  }
  if (allBuilt) {
    showScreen(SCREENS.ADOPT, areaId);
    return;
  }
  if (gameState.foundPets && gameState.foundPets.includes(areaId)) {
    showScreen(SCREENS.BUILD, areaId);
    return;
  }
  showScreen(SCREENS.SEARCH, areaId);
}

// Material spawning
function spawnForestMaterial() {
  if (gameState.forestMaterials.length >= 5) return;
  const types = Object.keys(materialEmojis);
  const type = types[Math.floor(Math.random() * types.length)];
  const x = 0.08 + Math.random() * 0.84;
  // Place along edges/gaps, not on areas
  let y;
  const lane = Math.floor(Math.random() * 3);
  if (lane === 0) y = 0.12 + Math.random() * 0.08;       // top band
  else if (lane === 1) y = 0.52 + Math.random() * 0.05;  // middle gap
  else y = 0.9 + Math.random() * 0.05;                   // bottom
  gameState.forestMaterials.push({ type, x, y, seed: Math.random() * 100 });
  saveState();
}

const searchCanvas = document.getElementById('search-canvas');
const searchCtx = searchCanvas.getContext('2d');

let clickSparkles = [];
let petFound = false;

const searchScenes = {
  fire: {
    name: 'Inside the Volcano',
    description: '"Deep in the magical heart of a volcano!! Red is hiding somewhere in here!! Click around to find her!!"',
    hint: 'Look near the lava rivers!!',
    petX: 0.35, petY: 0.6, petAlpha: 0.05,
    draw(ctx, W, H, frameCount) {
      const bg = ctx.createLinearGradient(0,0,0,H);
      bg.addColorStop(0,'#0a0200'); bg.addColorStop(0.5,'#1a0500'); bg.addColorStop(1,'#2a0800');
      ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

      // Lava rivers
      for (let r = 0; r < 3; r++) {
        const ry = H*(0.5 + r*0.15);
        const lg = ctx.createLinearGradient(0,ry-8,0,ry+8);
        lg.addColorStop(0,'#ffaa00'); lg.addColorStop(0.5,'#ff4400'); lg.addColorStop(1,'#cc2200');
        ctx.fillStyle = lg;
        ctx.shadowColor = '#ff4400'; ctx.shadowBlur = 15;
        ctx.beginPath();
        for (let x = 0; x <= W; x += 20) {
          const y = ry + Math.sin(x*0.02 + frameCount*0.05 + r)*8;
          if (x === 0) ctx.moveTo(x, y-6); else ctx.lineTo(x, y-6);
        }
        for (let x = W; x >= 0; x -= 20) {
          const y = ry + Math.sin(x*0.02 + frameCount*0.05 + r)*8;
          ctx.lineTo(x, y+6);
        }
        ctx.closePath(); ctx.fill(); ctx.shadowBlur = 0;
      }

      // Red weeds
      for (let w = 0; w < 20; w++) {
        const wx = (w*73+50) % (W-100) + 50;
        const wy = H*0.3 + (w%5)*40;
        const wh = 20 + w%20;
        const sway = Math.sin(frameCount*0.03+w)*4;
        ctx.strokeStyle = ['#cc2200','#aa1100','#dd3300'][w%3];
        ctx.lineWidth = 3; ctx.lineCap = 'round';
        ctx.shadowColor = '#ff2200'; ctx.shadowBlur = 5;
        ctx.beginPath();
        ctx.moveTo(wx, wy);
        ctx.bezierCurveTo(wx+sway, wy-wh*0.4, wx+sway*2, wy-wh*0.7, wx+sway*1.5, wy-wh);
        ctx.stroke(); ctx.shadowBlur = 0;
      }

      // Embers
      for (let e = 0; e < 20; e++) {
        const ex = (e*53 + frameCount*0.8) % W;
        const ey = H*0.8 - ((e*31 + frameCount*0.6) % (H*0.6));
        const alpha = 0.4 + Math.sin(frameCount*0.08+e)*0.3;
        ctx.fillStyle = `rgba(255,${100+e*5},0,${alpha})`;
        ctx.shadowColor = '#ff4400'; ctx.shadowBlur = 6;
        ctx.beginPath(); ctx.arc(ex,ey,2+e%3,0,Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0;
      }

      // Rocky walls
      ctx.fillStyle = '#2a1005';
      ctx.beginPath();

function drawElement(ctx, cx, cy, frameCount) {
  const wingFlap = Math.sin(frameCount * 0.04) * 15;
  const bob = Math.sin(frameCount * 0.02) * 8;
  cy += bob;

  // Rainbow trail behind
  for (let t = 0; t < 10; t++) {
    const trailX = cx - t * 8;
    const trailY = cy + 30 + Math.sin(frameCount * 0.04 - t * 0.3) * 5;
    const trailColors = ['#ff4444','#ff8844','#ffcc44','#44cc44','#4488ff','#8844ff','#ff44cc','#ff4488','#44ffcc','#ffaacc'];
    const alpha = (1 - t/10) * 0.6;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = trailColors[t];
    ctx.shadowColor = trailColors[t]; ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.ellipse(trailX, trailY, 4 - t*0.3, 2, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;

  // TAIL — long and thin
  ctx.strokeStyle = 'rgba(200,200,255,0.8)';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx + 10, cy + 15);
  ctx.bezierCurveTo(
    cx + 40, cy + 25,
    cx + 70, cy + 20,
    cx + 100, cy + Math.sin(frameCount * 0.05) * 15
  );
  ctx.stroke();

  // LEFT WING — flat and wide
  const leftWingGrad = ctx.createLinearGradient(cx - 90, cy, cx, cy);
  leftWingGrad.addColorStop(0, 'rgba(255,68,68,0.85)');
  leftWingGrad.addColorStop(0.25, 'rgba(255,200,68,0.85)');
  leftWingGrad.addColorStop(0.5, 'rgba(68,200,68,0.85)');
  leftWingGrad.addColorStop(0.75, 'rgba(68,136,255,0.85)');
  leftWingGrad.addColorStop(1, 'rgba(136,68,255,0.85)');
  ctx.fillStyle = leftWingGrad;
  ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 15;
  ctx.beginPath();
  ctx.moveTo(cx, cy - 12);
  ctx.bezierCurveTo(cx - 30, cy - 20 - wingFlap, cx - 70, cy - 15 - wingFlap, cx - 90, cy);
  ctx.bezierCurveTo(cx - 70, cy + 15 + wingFlap, cx - 30, cy + 20 + wingFlap, cx, cy + 15);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;

  // RIGHT WING — flat and wide
  const rightWingGrad = ctx.createLinearGradient(cx, cy, cx + 90, cy);
  rightWingGrad.addColorStop(0, 'rgba(136,68,255,0.85)');
  rightWingGrad.addColorStop(0.25, 'rgba(255,68,200,0.85)');
  rightWingGrad.addColorStop(0.5, 'rgba(255,200,68,0.85)');
  rightWingGrad.addColorStop(0.75, 'rgba(68,200,68,0.85)');
  rightWingGrad.addColorStop(1, 'rgba(255,68,68,0.85)');
  ctx.fillStyle = rightWingGrad;
  ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 15;
  ctx.beginPath();
  ctx.moveTo(cx, cy - 12);
  ctx.bezierCurveTo(cx + 30, cy - 20 - wingFlap, cx + 70, cy - 15 - wingFlap, cx + 90, cy);
  ctx.bezierCurveTo(cx + 70, cy + 15 + wingFlap, cx + 30, cy + 20 + wingFlap, cx, cy + 15);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;

  // BODY CENTER — slightly raised diamond shape
  const bodyGrad = ctx.createRadialGradient(cx - 5, cy - 5, 3, cx, cy, 28);
  bodyGrad.addColorStop(0, '#ffffff');
  bodyGrad.addColorStop(0.4, 'rgba(220,220,255,0.95)');
  bodyGrad.addColorStop(1, 'rgba(180,180,255,0.8)');
  ctx.fillStyle = bodyGrad;
  ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 20;
  ctx.beginPath();
  ctx.ellipse(cx, cy, 24, 18, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // EYES — on top of body, cute!!
  [[cx - 9, cy - 5],[cx + 9, cy - 5]].forEach(([ex, ey]) => {
    ctx.fillStyle = 'white';
    ctx.beginPath(); ctx.ellipse(ex, ey, 6, 5, 0, 0, Math.PI*2); ctx.fill();
    const irisGrad = ctx.createRadialGradient(ex-1, ey-1, 0.5, ex, ey, 4);
    irisGrad.addColorStop(0, '#ffffff');
    irisGrad.addColorStop(0.4, 'rgba(150,200,255,0.9)');
    irisGrad.addColorStop(1, 'rgba(100,100,255,0.9)');
    ctx.fillStyle = irisGrad;
    ctx.beginPath(); ctx.ellipse(ex, ey, 4, 4, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#050510';
    ctx.beginPath(); ctx.ellipse(ex+0.5, ey+0.5, 2, 2.5, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'white';
    ctx.beginPath(); ctx.ellipse(ex-1.5, ey-1.5, 1.5, 1.5, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(ex+2, ey-1, 1, 1, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#050510'; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(ex-6, ey-3);
    ctx.bezierCurveTo(ex-2, ey-8, ex+2, ey-8, ex+6, ey-3);
    ctx.stroke();
  });

  // Smile
  ctx.strokeStyle = 'rgba(150,150,255,0.8)';
  ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - 8, cy + 6);
  ctx.bezierCurveTo(cx - 4, cy + 10, cx + 4, cy + 10, cx + 8, cy + 6);
  ctx.stroke();

  // Blush
  ctx.fillStyle = 'rgba(255,150,200,0.35)';
  ctx.beginPath(); ctx.ellipse(cx - 16, cy + 2, 8, 5, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + 16, cy + 2, 8, 5, 0, 0, Math.PI*2); ctx.fill();

  // Orbiting rainbow sparkles
  for (let s = 0; s < 6; s++) {
    const sa = (s/6)*Math.PI*2 + frameCount*0.03;
    const sr = 65 + Math.sin(frameCount*0.04+s)*8;
    const sx = cx + Math.cos(sa)*sr;
    const sy = cy + Math.sin(sa)*sr*0.5;
    const sColors = ['#ff4444','#ffcc44','#44cc44','#4488ff','#cc44ff','#ff44cc'];
    const alpha = 0.4 + Math.sin(frameCount*0.05+s)*0.3;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = sColors[s];
    ctx.shadowColor = sColors[s]; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(sx, sy, 3, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  }

  // Name
  ctx.font = 'bold 14px "Press Start 2P", monospace';
  ctx.textAlign = 'center';
  const nameGrad = ctx.createLinearGradient(cx-50, 0, cx+50, 0);
  nameGrad.addColorStop(0, '#ff4444');
  nameGrad.addColorStop(0.5, '#ffcc44');
  nameGrad.addColorStop(1, '#4488ff');
  ctx.fillStyle = nameGrad;
  ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 10;
  ctx.fillText('ELEMENT', cx, cy + 55);
  ctx.shadowBlur = 0;
}

function initSearch(areaId) {
  petFound = false;
  clickSparkles = [];
  const scene = searchScenes[areaId];
  document.getElementById('search-title').textContent = scene.name;
  document.getElementById('search-title').style.color = areaData[areaId].color;
  document.getElementById('search-desc').textContent = scene.description;
  document.getElementById('search-hint').textContent = '💡 ' + scene.hint;
}

function handleSearchClick(clickX, clickY) {
  const scene = searchScenes[currentArea];
  const W = searchCanvas.width, H = searchCanvas.height;
  const petX = scene.petX * W, petY = scene.petY * H;
  const dist = Math.hypot(clickX - petX, clickY - petY);
  const found = dist < 55;
  clickSparkles.push({ x: clickX, y: clickY, time: 0, found });
  if (found && !petFound) {
    petFound = true;
    toast(`✨ Found ${areaData[currentArea].pet}!!`, areaData[currentArea].color);
    setTimeout(() => {
      if (!gameState.foundPets.includes(currentArea)) gameState.foundPets.push(currentArea);
      saveState();
      showScreen(SCREENS.BUILD, currentArea);
    }, 1400);
  } else if (!found) {
    // small hint indicator
    if (dist < 130) toast('Getting warmer!!', '#ffcc88');
  }
}

searchCanvas.addEventListener('click', (e) => {
  const rect = searchCanvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (searchCanvas.width / rect.width);
  const y = (e.clientY - rect.top) * (searchCanvas.height / rect.height);
  if (currentScreen === SCREENS.SEARCH) handleSearchClick(x, y);
});
searchCanvas.addEventListener('touchstart', (e) => {

  const rect = searchCanvas.getBoundingClientRect();
  const touch = e.touches[0];
  const x = (touch.clientX - rect.left) * (searchCanvas.width / rect.width);
  const y = (touch.clientY - rect.top) * (searchCanvas.height / rect.height);
  if (currentScreen === SCREENS.SEARCH) handleSearchClick(x, y);
}, { passive: false });

function drawClickSparkles(ctx, frameCount) {
  clickSparkles = clickSparkles.filter(sp => sp.time < 30);
  clickSparkles.forEach(sp => {
    const alpha = 1 - sp.time/30;
    const color = sp.found ? '#ffcc44' : '#88ff88';
    for (let i = 0; i < 6; i++) {
      const a = (i/6)*Math.PI*2 + sp.time*0.2;
      const r = sp.time*2;
      ctx.fillStyle = color;
      ctx.globalAlpha = alpha;
      ctx.shadowColor = color; ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(sp.x + Math.cos(a)*r, sp.y + Math.sin(a)*r, 3, 0, Math.PI*2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
    ctx.globalAlpha = 1;
    sp.time++;
  });
  // Draw revealed pet if found
  if (petFound) {
    const scene = searchScenes[currentArea];
    const px = scene.petX * searchCanvas.width;
    const py = scene.petY * searchCanvas.height;
    if (currentArea === 'rainbow') {
      drawElement(ctx, px, py, frameCount);
    } else {
      ctx.font = '54px serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.shadowColor = areaData[currentArea].color; ctx.shadowBlur = 25;
      ctx.fillText(areaData[currentArea].petEmoji, px, py);
      ctx.shadowBlur = 0;
    }
  }
}

function canAffordFurniture(materials) {
  return Object.entries(materials).every(([mat, amt]) => (gameState.materials[mat] || 0) >= amt);
}

function updateMaterialsBar() {
  const bar = document.getElementById('materials-bar');
  if (!bar) return;
  bar.innerHTML = Object.entries(materialEmojis).map(([key, emoji]) => `
    <div class="material-chip">
      <span>${emoji}</span>
      <span class="material-count">${gameState.materials[key] || 0}</span>
    </div>
  `).join('');
}

function updateTopMats() {
  const bar = document.getElementById('map-mats');
  if (!bar) return;
  bar.innerHTML = Object.entries(materialEmojis).map(([key, emoji]) => `
    <span>${emoji}<span class="count">${gameState.materials[key] || 0}</span></span>
  `).join('');
}

function initBuild(areaId) {
  roomFurniturePos = {};
  const builtHome = gameState.builtHomes[areaId] || {};
  const home = homeData[areaId];

  document.getElementById('build-title').textContent = home.name.toUpperCase();
  document.getElementById('build-title').style.color = home.accent;

  // Pre-place already-built furniture
  const builtKeys = Object.keys(builtHome).filter(k => builtHome[k]);
  const positions = { bed: {x:0.25,y:0.6}, lamp: {x:0.55,y:0.45}, bookshelf: {x:0.78,y:0.55}, memoryJar: {x:0.42,y:0.7} };
  builtKeys.forEach(k => { roomFurniturePos[k] = positions[k]; });

  updateMaterialsBar();
  refreshFurnitureShop(areaId);
  drawRoom(areaId);

  const allBuilt = ['bed','lamp','bookshelf','memoryJar'].every(k => (gameState.builtHomes[areaId] || {})[k]);
  document.getElementById('adopt-ready').style.display = allBuilt ? 'block' : 'none';
}

function refreshFurnitureShop(areaId) {
  const home = homeData[areaId];
  const builtHome = gameState.builtHomes[areaId] || {};
  const shop = document.getElementById('furniture-shop');
  shop.innerHTML = '';
  Object.entries(home.furniture).forEach(([key, item]) => {
    const isBuilt = !!builtHome[key];
    const canAfford = canAffordFurniture(item.materials);
    const card = document.createElement('div');
    card.className = 'furniture-card' + (isBuilt ? ' built' : '') + (!isBuilt && !canAfford ? ' cant-afford' : '');
    card.style.borderColor = isBuilt ? '#44ff44' : (canAfford ? home.accent + '55' : '#333344');
    card.dataset.furnitureKey = key;
    const cost = Object.entries(item.materials).map(([m,a]) => `${materialEmojis[m]}×${a}`).join(' ');
    card.innerHTML = `
      <div class="furniture-emoji">${item.emoji}</div>
      <p class="furniture-name" style="color:${isBuilt ? '#44ff44' : home.accent}">${item.label}</p>
      <p class="furniture-cost">${isBuilt ? '✅ BUILT!!' : cost}</p>
    `;
    if (!isBuilt) {
      card.draggable = canAfford;
      card.addEventListener('dragstart', (e) => {
        if (!canAfford) { e.preventDefault(); return; }
        draggedItem = key;
        e.dataTransfer.setData('text/plain', key);
      });
      // Tap to place if can afford (mobile-friendly fallback)
      card.addEventListener('click', () => {
        if (!canAfford) {
          toast('Not enough materials!! Gather more!!', '#ffaaaa');
          return;
        }
        const positions = { bed: {x:0.25,y:0.6}, lamp: {x:0.55,y:0.45}, bookshelf: {x:0.78,y:0.55}, memoryJar: {x:0.42,y:0.7} };
        placeFurniture(key, positions[key].x, positions[key].y, areaId);
      });
    }
    shop.appendChild(card);
  });
}

  const rect = roomCanvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width;
  const y = (e.clientY - rect.top) / rect.height;
  placeFurniture(draggedItem, x, y, currentArea);
  draggedItem = null;
});

function placeFurniture(key, x, y, areaId) {
  const home = homeData[areaId];
  const item = home.furniture[key];
  const builtHome = gameState.builtHomes[areaId] || {};
  if (builtHome[key]) return;
  if (!canAffordFurniture(item.materials)) {
    toast('Not enough materials!!', '#ffaaaa');
    return;
  }
  Object.entries(item.materials).forEach(([mat, amt]) => {
    gameState.materials[mat] = (gameState.materials[mat] || 0) - amt;
  });
  if (!gameState.builtHomes[areaId]) gameState.builtHomes[areaId] = {};
  gameState.builtHomes[areaId][key] = true;
  roomFurniturePos[key] = { x: Math.max(0.08, Math.min(0.92, x)), y: Math.max(0.2, Math.min(0.85, y)) };
  saveState();
  toast(`${item.label} built!!`, home.accent);

  const allBuilt = ['bed','lamp','bookshelf','memoryJar'].every(k => gameState.builtHomes[areaId][k]);
  document.getElementById('adopt-ready').style.display = allBuilt ? 'block' : 'none';
  updateMaterialsBar();
  updateTopMats();
  refreshFurnitureShop(areaId);
}

function drawRoom(areaId) {
  if (currentScreen !== SCREENS.BUILD) return;
  const W = roomCanvas.width, H = roomCanvas.height;
  const ctx = roomCanvas.getContext('2d');
  const home = homeData[areaId];

  ctx.clearRect(0,0,W,H);

  // Wall gradient
  const wallGrad = ctx.createLinearGradient(0,0,0,H);
  wallGrad.addColorStop(0, home.bg);
  wallGrad.addColorStop(1, '#030305');
  ctx.fillStyle = wallGrad;
  ctx.fillRect(0,0,W,H);

  // Floor
  const floorGrad = ctx.createLinearGradient(0,H*0.75,0,H);
  floorGrad.addColorStop(0, home.accent + '22');
  floorGrad.addColorStop(1, home.accent + '11');
  ctx.fillStyle = floorGrad;
  ctx.fillRect(0,H*0.75,W,H*0.25);

  ctx.strokeStyle = home.accent + '44';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0,H*0.75); ctx.lineTo(W,H*0.75); ctx.stroke();

  // Wall pattern (subtle dots)
  for (let p = 0; p < 30; p++) {
    const px = (p * 73) % W;
    const py = (p * 41) % (H*0.75);
    ctx.fillStyle = home.accent + '0a';
    ctx.beginPath(); ctx.arc(px, py, 2, 0, Math.PI*2); ctx.fill();
  }

  // Drop zone hint
  const placedCount = Object.keys(roomFurniturePos).length;
  if (placedCount === 0) {
    ctx.strokeStyle = home.accent + '44';
    ctx.lineWidth = 2;
    ctx.setLineDash([8,6]);
    ctx.beginPath();
    if (ctx.roundRect) {
      ctx.roundRect(W*0.1, H*0.15, W*0.8, H*0.7, 12);
    } else {
      ctx.rect(W*0.1, H*0.15, W*0.8, H*0.7);
    }
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = home.accent + '88';
    ctx.font = '11px "Press Start 2P", monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('DRAG OR TAP FURNITURE HERE!!', W/2, H/2);
  }

  // Furniture
  Object.entries(roomFurniturePos).forEach(([key, pos]) => {
    const item = home.furniture[key];
    const fx = pos.x * W, fy = pos.y * H;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(fx, Math.min(fy+22, H*0.82), 24, 7, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowColor = item.color; ctx.shadowBlur = 18;
    ctx.font = '36px serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(item.emoji, fx, fy);
    ctx.shadowBlur = 0;
    ctx.font = '7px "Press Start 2P", monospace';
    ctx.fillStyle = item.color;
    ctx.fillText(item.label.split(' ')[0], fx, fy + 30);
  });

  // Memory jar magical item
  if (roomFurniturePos.memoryJar) {
    const pulse = 0.5 + Math.sin(frame*0.05)*0.3;
    ctx.globalAlpha = pulse;
    ctx.font = '18px serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(home.memoryItem, roomFurniturePos.memoryJar.x*W, roomFurniturePos.memoryJar.y*H - 32);
    ctx.globalAlpha = 1;
  }

  // Title overlay
  ctx.font = '10px "Press Start 2P", monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = home.accent;
  ctx.shadowColor = home.accent; ctx.shadowBlur = 8;
  ctx.fillText(home.name.toUpperCase(), W/2, 22);
  ctx.shadowBlur = 0;
}

function initAdopt(areaId) {

    saveState();

function drawAdoptionCeremony(ctx, W, H, frameCount, areaId) {
  const area = areaData[areaId];
  ctx.fillStyle = '#05050f'; ctx.fillRect(0,0,W,H);

  // Light beam
  const beamGrad = ctx.createLinearGradient(0,0,0,H);
  beamGrad.addColorStop(0, area.color + '44');
  beamGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = beamGrad;
  ctx.beginPath();
  ctx.moveTo(W*0.35, 0); ctx.lineTo(W*0.65, 0);
  ctx.lineTo(W*0.8, H); ctx.lineTo(W*0.2, H);
  ctx.closePath(); ctx.fill();

  // Stars
  for (let s = 0; s < 80; s++) {
    const sx = (s*137)%W, sy = (s*79)%H;
    const alpha = 0.1 + Math.sin(frameCount*0.04+s)*0.08;
    ctx.fillStyle = `rgba(255,255,220,${alpha})`;
    ctx.beginPath(); ctx.arc(sx,sy,1,0,Math.PI*2); ctx.fill();
  }

  // Orbiting sparkles
  for (let s = 0; s < 16; s++) {
    const sa = (s/16)*Math.PI*2 + frameCount*0.04;
    const sr = 100 + Math.sin(frameCount*0.03+s)*30;
    const sx = W/2 + Math.cos(sa)*sr;
    const sy = H*0.42 + Math.sin(sa)*sr*0.6;
    const alpha = 0.5 + Math.sin(frameCount*0.05+s)*0.3;
    ctx.fillStyle = area.color;
    ctx.globalAlpha = alpha;
    ctx.shadowColor = area.color; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.arc(sx,sy,3,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  }

  // Pet in center
  const petBob = Math.sin(frameCount*0.04)*10;
  if (areaId === 'rainbow') {
    drawElement(ctx, W/2, H*0.4 + petBob, frameCount);
  } else {
    ctx.font = '90px serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = area.color; ctx.shadowBlur = 40;
    ctx.fillText(area.petEmoji, W/2, H*0.4+petBob);
    ctx.shadowBlur = 0;
  }

  // Text
  ctx.font = '13px "Press Start 2P", monospace';
  ctx.fillStyle = area.color;
  ctx.shadowColor = area.color; ctx.shadowBlur = 10;
  ctx.fillText(area.pet.toUpperCase() + ' HAS BEEN ADOPTED!!', W/2, H*0.7);
  ctx.shadowBlur = 0;

  ctx.font = '20px "Dancing Script", cursive';
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fillText(area.adoptMessage, W/2, H*0.8);

  // Continue prompt
  const elapsed = frameCount - adoptStartFrame;
  if (elapsed > 90) {
    ctx.font = '9px "Press Start 2P", monospace';
    const btnAlpha = 0.5 + Math.sin(frameCount*0.08)*0.4;
    ctx.fillStyle = `rgba(255,255,255,${btnAlpha})`;
    ctx.fillText('TAP TO CONTINUE → CHOOSE YOUR PATH!!', W/2, H*0.92);
  }
}

  { id:'witch', name:'WITCH', emoji:'🧙', color:'#cc44ff',
    description:'Masters of spells and potions!! Witches explore magical secrets and brew powerful magic!!' },
  { id:'knight', name:'KNIGHT', emoji:'⚔️', color:'#ffcc44',

    description:'Precise and swift!! Archers explore distant lands and hit impossible targets!!' },
  { id:'explorer', name:'EXPLORER', emoji:'🗺️', color:'#44ff88',
    description:'Curious adventurers!! Explorers discover new lands and find hidden treasures!!' },
  { id:'healer', name:'HEALER', emoji:'💚', color:'#88ffcc',
    description:'Gentle and caring!! Healers look after all the creatures of Elemental Forest!!' },
];

const pathCanvas = document.getElementById('path-canvas');
const pathCtx = pathCanvas.getContext('2d');
let hoveredPath = null;

function initPath(areaId) {
  hoveredPath = null;
}

function getPathCardRects(W, H) {
  const pathW = W*0.17;
  const pathH = H*0.5;
  const gap = W*0.025;
  const totalW = paths.length*pathW + (paths.length-1)*gap;
  const startX = (W - totalW)/2;
  return paths.map((p, i) => ({
    id: p.id, x: startX + i*(pathW + gap), y: H*0.25, w: pathW, h: pathH
  }));
}

function drawPathSelection(ctx, W, H, frameCount) {
  ctx.fillStyle = '#05050f'; ctx.fillRect(0,0,W,H);

  // Background stars
  for (let s = 0; s < 70; s++) {
    const sx = (s*137)%W, sy = (s*79)%H;
    const alpha = 0.08 + Math.sin(frameCount*0.03+s)*0.06;
    ctx.fillStyle = `rgba(200,200,255,${alpha})`;
    ctx.beginPath(); ctx.arc(sx,sy,1,0,Math.PI*2); ctx.fill();
  }

  const area = areaData[currentArea];
  ctx.font = '11px "Press Start 2P", monospace';
  ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = '#aaaaff'; ctx.shadowBlur = 8;
  ctx.fillText('CHOOSE YOUR PATH!!', W/2, 38);
  ctx.shadowBlur = 0;

  ctx.font = '15px "Dancing Script", cursive';
  ctx.fillStyle = 'rgba(180,180,255,0.75)';
  ctx.fillText(`"What magical destiny awaits ${area.pet}??"`, W/2, 64);

  const rects = getPathCardRects(W, H);
  const currentPath = gameState.petPaths[currentArea];

  rects.forEach((rect, i) => {
    const path = paths[i];
    const isHovered = hoveredPath === path.id;
    const isSelected = currentPath === path.id;
    const scale = isHovered ? 1.04 : 1;

    ctx.save();
    ctx.translate(rect.x + rect.w/2, rect.y + rect.h/2);
    ctx.scale(scale, scale);
    ctx.translate(-(rect.x + rect.w/2), -(rect.y + rect.h/2));

    const cardGrad = ctx.createLinearGradient(rect.x, rect.y, rect.x, rect.y+rect.h);
    cardGrad.addColorStop(0, isSelected ? path.color + '33' : '#12122a');
    cardGrad.addColorStop(1, '#060610');
    ctx.fillStyle = cardGrad;
    ctx.shadowColor = isSelected || isHovered ? path.color : 'transparent';
    ctx.shadowBlur = isSelected ? 22 : (isHovered ? 12 : 0);
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(rect.x, rect.y, rect.w, rect.h, 14);
    else ctx.rect(rect.x, rect.y, rect.w, rect.h);
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.strokeStyle = isSelected ? path.color : (isHovered ? path.color + '99' : path.color + '44');
    ctx.lineWidth = isSelected ? 3 : 1.5;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(rect.x, rect.y, rect.w, rect.h, 14);
    else ctx.rect(rect.x, rect.y, rect.w, rect.h);
    ctx.stroke();

    ctx.font = '36px serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.shadowColor = path.color; ctx.shadowBlur = isHovered ? 15 : 6;
    ctx.fillText(path.emoji, rect.x + rect.w/2, rect.y + rect.h*0.22);
    ctx.shadowBlur = 0;

    ctx.font = 'bold 8px "Press Start 2P", monospace';
    ctx.fillStyle = path.color;
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(path.name, rect.x + rect.w/2, rect.y + rect.h*0.45);

    // Wrap description
    ctx.font = '11px "Nunito", sans-serif';
    ctx.fillStyle = 'rgba(200,200,220,0.85)';
    const words = path.description.split(' ');
    let line = '';
    let lineY = rect.y + rect.h*0.55;
    words.forEach(word => {
      const test = line + word + ' ';
      const w = ctx.measureText(test).width;
      if (w > rect.w - 16 && line) {
        ctx.fillText(line.trim(), rect.x + rect.w/2, lineY);
        line = word + ' ';
        lineY += 14;
      } else {
        line = test;
      }
    });
    if (line) ctx.fillText(line.trim(), rect.x + rect.w/2, lineY);

    if (isSelected) {
      ctx.font = '20px serif';
      ctx.textBaseline = 'middle';
      ctx.fillText('✅', rect.x + rect.w/2, rect.y + rect.h*0.92);
    }
    ctx.restore();
  });

  // Hint at the bottom
  ctx.font = '10px "Press Start 2P", monospace';
  ctx.fillStyle = currentPath ? '#88ff88' : 'rgba(255,255,255,0.45)';
  ctx.textAlign = 'center';
  ctx.fillText(currentPath
    ? 'PATH CHOSEN!! TAP AGAIN OR HEAD HOME →'
    : 'PICK A PATH FOR YOUR PET!!', W/2, H*0.92);
}

pathCanvas.addEventListener('mousemove', (e) => {
  if (currentScreen !== SCREENS.PATH) return;
  const rect = pathCanvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (pathCanvas.width / rect.width);
  const y = (e.clientY - rect.top) * (pathCanvas.height / rect.height);
  const rects = getPathCardRects(pathCanvas.width, pathCanvas.height);
  const hit = rects.find(r => x >= r.x && x <= r.x+r.w && y >= r.y && y <= r.y+r.h);
  hoveredPath = hit ? hit.id : null;
  pathCanvas.style.cursor = hit ? 'pointer' : 'default';
});
pathCanvas.addEventListener('mouseleave', () => { hoveredPath = null; });

function handlePathClick(x, y) {
  const rects = getPathCardRects(pathCanvas.width, pathCanvas.height);
  const hit = rects.find(r => x >= r.x && x <= r.x+r.w && y >= r.y && y <= r.y+r.h);
  if (hit) {
    const wasSelected = gameState.petPaths[currentArea] === hit.id;
    gameState.petPaths[currentArea] = hit.id;
    saveState();
    if (wasSelected) {
      showScreen(SCREENS.HOMEVIEW, currentArea);
    } else {
      const p = paths.find(pp => pp.id === hit.id);
      toast(`${areaData[currentArea].pet} is now a ${p.name}!!`, p.color);
    }
  } else {
    // Tap outside cards goes home if a path is set
    if (gameState.petPaths[currentArea]) {
      showScreen(SCREENS.HOMEVIEW, currentArea);
    }
  }
}

pathCanvas.addEventListener('click', (e) => {
  if (currentScreen !== SCREENS.PATH) return;
  const rect = pathCanvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (pathCanvas.width / rect.width);
  const y = (e.clientY - rect.top) * (pathCanvas.height / rect.height);
  handlePathClick(x, y);
});
pathCanvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (currentScreen !== SCREENS.PATH) return;
  const rect = pathCanvas.getBoundingClientRect();
  const touch = e.touches[0];
  const x = (touch.clientX - rect.left) * (pathCanvas.width / rect.width);
  const y = (touch.clientY - rect.top) * (pathCanvas.height / rect.height);
  handlePathClick(x, y);
}, { passive: false });

  `;

function drawHomeView(ctx, W, H, frameCount, areaId) {
  const home = homeData[areaId];
  const area = areaData[areaId];

  const wallGrad = ctx.createLinearGradient(0,0,0,H);
  wallGrad.addColorStop(0, home.bg);
  wallGrad.addColorStop(1, '#030305');
  ctx.fillStyle = wallGrad; ctx.fillRect(0,0,W,H);

  // Floor
  const floorGrad = ctx.createLinearGradient(0,H*0.75,0,H);
  floorGrad.addColorStop(0, home.accent + '33');
  floorGrad.addColorStop(1, home.accent + '11');
  ctx.fillStyle = floorGrad; ctx.fillRect(0,H*0.75,W,H*0.25);
  ctx.strokeStyle = home.accent + '44';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0,H*0.75); ctx.lineTo(W,H*0.75); ctx.stroke();

  // Wall pattern dots
  for (let p = 0; p < 50; p++) {
    const px = (p*73)%W, py = (p*41)%(H*0.75);
    ctx.fillStyle = home.accent + '11';
    ctx.beginPath(); ctx.arc(px, py, 2, 0, Math.PI*2); ctx.fill();
  }

  // Furniture
  const fixedPos = { bed: {x:0.2,y:0.65}, lamp: {x:0.5,y:0.45}, bookshelf: {x:0.82,y:0.6}, memoryJar: {x:0.4,y:0.75} };
  ['bookshelf','lamp','bed','memoryJar'].forEach(key => {
    const item = home.furniture[key];
    const pos = fixedPos[key];
    const fx = pos.x*W, fy = pos.y*H;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(fx, Math.min(fy+22, H*0.82), 22, 6, 0, 0, Math.PI*2); ctx.fill();
    ctx.shadowColor = item.color; ctx.shadowBlur = 16;
    ctx.font = '38px serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(item.emoji, fx, fy);
    ctx.shadowBlur = 0;
  });

  // Memory jar contents
  const memCount = Math.min((gameState.adventuresCompleted[areaId] || 0), 6);
  const mx = fixedPos.memoryJar.x * W;
  const my = fixedPos.memoryJar.y * H - 6;
  for (let i = 0; i < memCount; i++) {
    const ma = (i / Math.max(memCount,1)) * Math.PI * 2 + frameCount*0.02;
    const mr = 8 + Math.sin(frameCount*0.05+i)*2;
    ctx.font = '14px serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.globalAlpha = 0.85;
    ctx.fillText(home.memoryItem, mx + Math.cos(ma)*mr, my + Math.sin(ma)*mr*0.5);
    ctx.globalAlpha = 1;
  }

  // PET in center
  const petBob = Math.sin(frameCount*0.03)*6;
  if (areaId === 'rainbow') {
    drawElement(ctx, W*0.55, H*0.55 + petBob, frameCount);
  } else {
    ctx.shadowColor = area.color; ctx.shadowBlur = 25;
    ctx.font = '64px serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(area.petEmoji, W*0.55, H*0.55 + petBob);
    ctx.shadowBlur = 0;
  }

  // Path badge floating above pet
  const path = paths.find(p => p.id === gameState.petPaths[areaId]);
  if (path) {
    ctx.font = '22px serif';
    ctx.shadowColor = path.color; ctx.shadowBlur = 14;
    ctx.fillText(path.emoji, W*0.62, H*0.42 + petBob);
    ctx.shadowBlur = 0;
  }

  // Floating particles
  for (let s = 0; s < 8; s++) {
    const sa = (s/8)*Math.PI*2 + frameCount*0.02;
    const sr = 50 + Math.sin(frameCount*0.04+s)*15;
    const sx = W*0.55 + Math.cos(sa)*sr;
    const sy = H*0.55 + Math.sin(sa)*sr*0.6;
    const alpha = 0.3 + Math.sin(frameCount*0.06+s)*0.2;
    ctx.fillStyle = area.color;
    ctx.globalAlpha = alpha;
    ctx.shadowColor = area.color; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(sx,sy,2,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  }
}
