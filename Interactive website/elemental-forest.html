const adventureCanvas = document.getElementById('adventure-canvas');
const adventureCtx = adventureCanvas.getContext('2d');

const adventureData = {
  witch:    { title: "🧪 BREW THE POTION!!", desc: "Click the ingredients in the order shown!!", color: '#cc44ff' },
  knight:   { title: "⚔️ DEFEND THE FOREST!!", desc: "Click shadow creatures before they reach the bottom!!", color: '#ffcc44' },
  archer:   { title: "🏹 HIT THE MOVING TARGETS!!", desc: "Click each target before they fly off the screen!!", color: '#44ccff' },
  explorer: { title: "🗺️ FIND THE HIDDEN TREASURES!!", desc: "Click the glowing spots to uncover treasures!!", color: '#44ff88' },
  healer:   { title: "💚 MATCH THE HEALING HERBS!!", desc: "Match each hurt creature with the right herb!!", color: '#88ffcc' },
};

let adv = null;

function initAdventure(areaId) {
  const pathId = gameState.petPaths[areaId];
  const info = adventureData[pathId];
  document.getElementById('adv-title').textContent = info.title;
  document.getElementById('adv-title').style.color = info.color;
  document.getElementById('adv-desc').textContent = info.desc;
  document.getElementById('adv-reward').textContent = '';
  adv = createAdventure(pathId);
  updateAdvScore();
}

function updateAdvScore() {
  document.getElementById('adv-score').textContent = `SCORE: ${adv.score}/${adv.target}  TIME: ${Math.max(0,Math.ceil(adv.timeLeft/60))}s`;
}

function createAdventure(pathId) {
  const W = adventureCanvas.width, H = adventureCanvas.height;
  if (pathId === 'witch') {
    const ingredients = [
      { emoji: '🍄', color: '#ff44cc' },
      { emoji: '🍇', color: '#8844ff' },
      { emoji: '🐸', color: '#44cc44' },
      { emoji: '⭐', color: '#ffcc44' },
      { emoji: '🌿', color: '#44ff88' },
      { emoji: '🔮', color: '#44ccff' },
    ];
    const order = [];
    for (let i = 0; i < 4; i++) order.push(Math.floor(Math.random()*ingredients.length));
    return {
      kind: 'witch', ingredients, order, step: 0, score: 0, target: order.length,
      timeLeft: 30*60, done: false,
      slots: ingredients.map((ing, i) => ({
        ...ing,
        x: W*(0.1 + (i % 3) * 0.4), y: H*(0.35 + Math.floor(i/3)*0.35), r: 38,
      })),
    };
  }
  if (pathId === 'knight') {
    return {
      kind: 'knight', score: 0, target: 8, timeLeft: 30*60, done: false,
      creatures: [], spawnCooldown: 0,
    };
  }
  if (pathId === 'archer') {
    return {
      kind: 'archer', score: 0, target: 8, timeLeft: 30*60, done: false,
      targets: [], spawnCooldown: 0,
    };
  }
  if (pathId === 'explorer') {
    const treasures = [];
    for (let i = 0; i < 6; i++) {
      treasures.push({
        x: W*(0.1 + Math.random()*0.8),
        y: H*(0.15 + Math.random()*0.7),
        found: false, seed: Math.random()*100,
      });
    }
    return { kind: 'explorer', score: 0, target: treasures.length, timeLeft: 30*60, done: false, treasures };
  }
  if (pathId === 'healer') {
    const pairs = [
      { creature: '🐰', herb: '🌿' },
      { creature: '🦔', herb: '🍄' },
      { creature: '🦌', herb: '🍃' },
      { creature: '🐿️', herb: '🌾' },
    ];
    // Layout: creatures left column, herbs right column shuffled
    const creatures = pairs.map((p, i) => ({
      emoji: p.creature, herb: p.herb, x: W*0.2, y: H*(0.2 + i*0.18), r: 32, healed: false,
    }));
    const herbsShuffled = [...pairs].sort(() => Math.random()-0.5);
    const herbs = herbsShuffled.map((p, i) => ({
      emoji: p.herb, x: W*0.8, y: H*(0.2 + i*0.18), r: 30, used: false,
    }));
    return {
      kind: 'healer', score: 0, target: pairs.length, timeLeft: 45*60, done: false,
      creatures, herbs, selectedCreature: null,
    };
  }
}

function drawAdventure(ctx, W, H, frameCount) {
  if (!adv) return;
  // Common starry bg
  ctx.fillStyle = '#050510'; ctx.fillRect(0,0,W,H);
  for (let s = 0; s < 70; s++) {
    const sx = (s*137)%W, sy = (s*79)%H;
    const alpha = 0.08 + Math.sin(frameCount*0.03+s)*0.06;
    ctx.fillStyle = `rgba(200,200,255,${alpha})`;
    ctx.beginPath(); ctx.arc(sx,sy,1,0,Math.PI*2); ctx.fill();
  }

  if (adv.kind === 'witch') {
    // Cauldron
    const cx = W*0.5, cy = H*0.85;
    const cauldronGrad = ctx.createRadialGradient(cx, cy-20, 5, cx, cy, 80);
    cauldronGrad.addColorStop(0, '#cc44ff');
    cauldronGrad.addColorStop(0.5, '#552288');
    cauldronGrad.addColorStop(1, '#1a0822');
    ctx.fillStyle = cauldronGrad;
    ctx.beginPath();
    ctx.ellipse(cx, cy, 80, 28, 0, 0, Math.PI*2);
    ctx.fill();
    // Cauldron bubble
    ctx.font = '40px serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🧪', cx, cy);
    // Order display
    ctx.font = '14px "Press Start 2P", monospace';
    ctx.fillStyle = '#cc44ff';
    ctx.shadowColor = '#cc44ff'; ctx.shadowBlur = 8;
    ctx.fillText('BREW IN ORDER:', W/2, 35);
    ctx.shadowBlur = 0;
    // Show order
    adv.order.forEach((idx, i) => {
      const ing = adv.ingredients[idx];
      const x = W*(0.3 + i*0.13);
      const y = 70;
      const done = i < adv.step;
      ctx.globalAlpha = done ? 0.35 : 1;
      ctx.font = '30px serif';
      ctx.shadowColor = ing.color; ctx.shadowBlur = done ? 4 : 12;
      ctx.fillText(ing.emoji, x, y);
      ctx.shadowBlur = 0;
      if (done) {
        ctx.font = '22px serif';
        ctx.fillStyle = '#44ff44';
        ctx.fillText('✓', x, y+24);
      }
      ctx.globalAlpha = 1;
    });
    // Slots
    adv.slots.forEach(slot => {
      ctx.beginPath();
      ctx.arc(slot.x, slot.y, slot.r, 0, Math.PI*2);
      ctx.fillStyle = slot.color + '22';
      ctx.fill();
      ctx.strokeStyle = slot.color + '88';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.font = '32px serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(slot.emoji, slot.x, slot.y);
    });
  }

  if (adv.kind === 'knight') {
    // Ground
    ctx.fillStyle = 'rgba(60,40,20,0.3)';
    ctx.fillRect(0, H-30, W, 30);
    ctx.fillStyle = '#ffcc44';
    ctx.font = '14px "Press Start 2P", monospace';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#ffcc44'; ctx.shadowBlur = 10;
    ctx.fillText('PROTECT THE FOREST!!', W/2, 35);
    ctx.shadowBlur = 0;
    // Castle silhouette at bottom
    ctx.fillStyle = 'rgba(80,80,120,0.4)';
    ctx.fillRect(W*0.4, H-30, W*0.2, 30);
    [W*0.42, W*0.5, W*0.58].forEach(x => {
      ctx.fillRect(x-6, H-44, 12, 14);
    });

    // Draw and update creatures
    adv.creatures.forEach(c => {
      ctx.font = '32px serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.shadowColor = '#aa44ff'; ctx.shadowBlur = 10;
      ctx.fillText(c.emoji, c.x, c.y);
      ctx.shadowBlur = 0;
    });
  }

  if (adv.kind === 'archer') {
    ctx.fillStyle = '#44ccff';
    ctx.font = '14px "Press Start 2P", monospace';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#44ccff'; ctx.shadowBlur = 10;
    ctx.fillText('HIT THE TARGETS!!', W/2, 35);
    ctx.shadowBlur = 0;

    adv.targets.forEach(t => {
      // Target rings
      const colors = ['#ff4444','#ffffff','#ff4444','#ffffff','#44ccff'];
      colors.forEach((c, i) => {
        ctx.fillStyle = c;
        ctx.shadowColor = '#44ccff'; ctx.shadowBlur = i === 0 ? 12 : 0;
        ctx.beginPath(); ctx.arc(t.x, t.y, 20 - i*3.5, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0;
      });
    });
  }

  if (adv.kind === 'explorer') {
    // Map background
    ctx.fillStyle = 'rgba(60,40,20,0.2)';
    for (let i = 0; i < 20; i++) {
      const tx = (i*73+30)%W, ty = (i*47+30)%H;
      ctx.beginPath(); ctx.arc(tx,ty,15+i%10,0,Math.PI*2); ctx.fill();
    }
    ctx.fillStyle = '#44ff88';
    ctx.font = '14px "Press Start 2P", monospace';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#44ff88'; ctx.shadowBlur = 10;
    ctx.fillText('FIND THE TREASURES!!', W/2, 35);
    ctx.shadowBlur = 0;
    // Treasures
    adv.treasures.forEach(t => {
      if (t.found) {
        ctx.font = '34px serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.shadowColor = '#ffcc44'; ctx.shadowBlur = 16;
        ctx.fillText('💰', t.x, t.y);
        ctx.shadowBlur = 0;
      } else {
        const pulse = 0.4 + Math.sin(frameCount*0.06 + t.seed)*0.3;
        ctx.globalAlpha = pulse;
        const halo = ctx.createRadialGradient(t.x, t.y, 2, t.x, t.y, 28);
        halo.addColorStop(0, '#44ff88aa');
        halo.addColorStop(1, 'transparent');
        ctx.fillStyle = halo;
        ctx.beginPath(); ctx.arc(t.x, t.y, 28, 0, Math.PI*2); ctx.fill();
        ctx.font = '14px serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('✦', t.x, t.y);
        ctx.globalAlpha = 1;
      }
    });
  }

  if (adv.kind === 'healer') {
    ctx.fillStyle = '#88ffcc';
    ctx.font = '14px "Press Start 2P", monospace';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#88ffcc'; ctx.shadowBlur = 10;
    ctx.fillText('MATCH CREATURES WITH HERBS!!', W/2, 35);
    ctx.shadowBlur = 0;

    adv.creatures.forEach((c, i) => {
      const selected = adv.selectedCreature === i;
      ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI*2);
      ctx.fillStyle = c.healed ? 'rgba(150,255,180,0.25)' : (selected ? 'rgba(255,200,100,0.3)' : 'rgba(80,80,120,0.25)');
      ctx.fill();
      ctx.strokeStyle = c.healed ? '#88ff88' : (selected ? '#ffcc44' : 'rgba(150,150,200,0.6)');
      ctx.lineWidth = selected ? 3 : 2;
      ctx.stroke();
      ctx.font = '30px serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(c.emoji, c.x, c.y);
      if (c.healed) {
        ctx.font = '20px serif';
        ctx.fillText('💚', c.x + c.r - 4, c.y - c.r + 4);
      }
    });
    adv.herbs.forEach(h => {
      ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, Math.PI*2);
      ctx.fillStyle = h.used ? 'rgba(80,80,80,0.2)' : 'rgba(100,255,180,0.18)';
      ctx.fill();
      ctx.strokeStyle = h.used ? 'rgba(150,150,150,0.3)' : '#88ffcc';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.globalAlpha = h.used ? 0.4 : 1;
      ctx.font = '28px serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(h.emoji, h.x, h.y);
      ctx.globalAlpha = 1;
    });
    // Draw connecting line if creature selected
    if (adv.selectedCreature !== null) {
      const c = adv.creatures[adv.selectedCreature];
      ctx.strokeStyle = '#ffcc4488';
      ctx.lineWidth = 2;
      ctx.setLineDash([6,6]);
      ctx.beginPath();
      ctx.moveTo(c.x, c.y);
      ctx.lineTo(adv.mouseX || W*0.5, adv.mouseY || H*0.5);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // Done overlay
  if (adv.done) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0,0,W,H);
    ctx.font = '18px "Press Start 2P", monospace';
    ctx.fillStyle = '#ffcc44';
    ctx.shadowColor = '#ffcc44'; ctx.shadowBlur = 15;
    ctx.textAlign = 'center';
    ctx.fillText(adv.success ? 'ADVENTURE COMPLETE!!' : "TIME'S UP!!", W/2, H*0.45);
    ctx.shadowBlur = 0;
    ctx.font = '14px "Dancing Script", cursive';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(adv.success ? '"You did it!!"' : '"Try again next time!!"', W/2, H*0.55);
    ctx.font = '10px "Press Start 2P", monospace';
    ctx.fillStyle = '#88ff88';
    ctx.fillText('TAP TO RETURN HOME', W/2, H*0.75);
  }
}

function updateAdventureLogic() {
  if (!adv || adv.done) return;
  adv.timeLeft--;
  const W = adventureCanvas.width, H = adventureCanvas.height;

  if (adv.kind === 'knight') {
    adv.spawnCooldown--;
    if (adv.spawnCooldown <= 0 && adv.creatures.length < 5) {
      adv.creatures.push({
        emoji: ['👻','🦇','🕷️'][Math.floor(Math.random()*3)],
        x: 50 + Math.random()*(W-100), y: -30,
        speed: 0.6 + Math.random()*0.8,
      });
      adv.spawnCooldown = 60 + Math.random()*40;
    }
    adv.creatures.forEach(c => { c.y += c.speed; });
    // Remove those that hit ground (with penalty)
    adv.creatures = adv.creatures.filter(c => {
      if (c.y > H - 50) {
        toast('A creature got through!!', '#ffaaaa');
        return false;
      }
      return true;
    });
  }
  if (adv.kind === 'archer') {
    adv.spawnCooldown--;
    if (adv.spawnCooldown <= 0 && adv.targets.length < 3) {
      const fromLeft = Math.random() > 0.5;
      adv.targets.push({
        x: fromLeft ? -20 : W+20,
        y: 80 + Math.random()*(H-160),
        vx: (fromLeft ? 1 : -1) * (1.2 + Math.random()*1.5),
        vy: (Math.random()-0.5) * 0.4,
      });
      adv.spawnCooldown = 70 + Math.random()*40;
    }
    adv.targets.forEach(t => { t.x += t.vx; t.y += t.vy; });
    adv.targets = adv.targets.filter(t => t.x > -40 && t.x < W+40);
  }

  // End conditions
  if (adv.score >= adv.target) {
    completeAdventure(true);
  } else if (adv.timeLeft <= 0) {
    completeAdventure(false);
  }
  updateAdvScore();
}

function completeAdventure(success) {
  if (adv.done) return;
  adv.done = true;
  adv.success = success;
  if (success) {
    // Targeted rewards based on path
    const pathId = gameState.petPaths && gameState.petPaths[currentArea];
    let rewards;
    if (pathId === 'witch')        rewards = { rainbowDust: 3, magicalWater: 2 };
    else if (pathId === 'knight')  rewards = { fireCrystals: 3, rainbowDust: 1 };
    else if (pathId === 'archer')  rewards = { cloudInBottle: 3, fireCrystals: 1 };
    else if (pathId === 'explorer')rewards = { shapeshiftingFlowers: 3, cloudInBottle: 1 };
    else if (pathId === 'healer')  rewards = { magicalWater: 3, shapeshiftingFlowers: 2 };
    else rewards = { rainbowDust: 1, magicalWater: 1, fireCrystals: 1, shapeshiftingFlowers: 1, cloudInBottle: 1 };

    Object.entries(rewards).forEach(([mat, amt]) => {
      gameState.materials[mat] = (gameState.materials[mat] || 0) + amt;
    });
    gameState.adventuresCompleted[currentArea] = (gameState.adventuresCompleted[currentArea] || 0) + 1;
    gameState.petAges[currentArea] = (gameState.petAges[currentArea] || 0) + 1;
    // Babies grow up too when their family goes adventuring
    if (gameState.babies) {
      gameState.babies.forEach(b => { b.age = (b.age || 0) + 1; });
    }
    saveState();
    updateTopMats();
    const rewardText = Object.entries(rewards).map(([m,a]) => `${materialEmojis[m]}×${a}`).join(' ');
    document.getElementById('adv-reward').textContent = `🌟 Adventure complete!! Got: ${rewardText}`;
  } else {
    document.getElementById('adv-reward').textContent = '"Better luck next time!!"';
  }
}

function handleAdventureClick(x, y) {
  if (!adv) return;
  if (adv.done) {
    showScreen(SCREENS.HOMEVIEW, currentArea);
    return;
  }
  if (adv.kind === 'witch') {
    // Find slot
    for (let slot of adv.slots) {
      if (Math.hypot(x - slot.x, y - slot.y) < slot.r) {
        const expected = adv.ingredients[adv.order[adv.step]];
        if (slot.emoji === expected.emoji) {
          adv.step++;
          adv.score++;
          toast('Correct!!', '#88ff88');
        } else {
          toast('Wrong ingredient!! Start over!!', '#ffaaaa');
          adv.step = 0;
          adv.score = 0;
        }
        return;
      }
    }
  }
  if (adv.kind === 'knight') {
    for (let i = 0; i < adv.creatures.length; i++) {
      const c = adv.creatures[i];
      if (Math.hypot(x - c.x, y - c.y) < 22) {
        adv.creatures.splice(i,1);
        adv.score++;
        return;
      }
    }
  }
  if (adv.kind === 'archer') {
    for (let i = 0; i < adv.targets.length; i++) {
      const t = adv.targets[i];
      if (Math.hypot(x - t.x, y - t.y) < 22) {
        adv.targets.splice(i,1);
        adv.score++;
        return;
      }
    }
  }
  if (adv.kind === 'explorer') {
    for (let t of adv.treasures) {
      if (!t.found && Math.hypot(x - t.x, y - t.y) < 28) {
        t.found = true;
        adv.score++;
        return;
      }
    }
  }
  if (adv.kind === 'healer') {
    // Click creature first
    for (let i = 0; i < adv.creatures.length; i++) {
      const c = adv.creatures[i];
      if (!c.healed && Math.hypot(x - c.x, y - c.y) < c.r) {
        adv.selectedCreature = i;
        return;
      }
    }
    // Or click herb if creature selected
    if (adv.selectedCreature !== null) {
      const c = adv.creatures[adv.selectedCreature];
      for (let h of adv.herbs) {
        if (!h.used && Math.hypot(x - h.x, y - h.y) < h.r) {
          if (h.emoji === c.herb) {
            c.healed = true;
            h.used = true;
            adv.score++;
            adv.selectedCreature = null;
            toast('Healed!!', '#88ffcc');
          } else {
            toast('Wrong herb for this creature!!', '#ffaaaa');
            adv.selectedCreature = null;
          }
          return;
        }
      }
    }
  }
}

adventureCanvas.addEventListener('click', (e) => {
  if (currentScreen !== SCREENS.ADVENTURE) return;
  const rect = adventureCanvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (adventureCanvas.width / rect.width);
  const y = (e.clientY - rect.top) * (adventureCanvas.height / rect.height);
  handleAdventureClick(x, y);
});
adventureCanvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (currentScreen !== SCREENS.ADVENTURE) return;
  const rect = adventureCanvas.getBoundingClientRect();
  const touch = e.touches[0];
  const x = (touch.clientX - rect.left) * (adventureCanvas.width / rect.width);
  const y = (touch.clientY - rect.top) * (adventureCanvas.height / rect.height);
  handleAdventureClick(x, y);
}, { passive: false });
adventureCanvas.addEventListener('mousemove', (e) => {
  if (!adv || adv.kind !== 'healer') return;
  const rect = adventureCanvas.getBoundingClientRect();
  adv.mouseX = (e.clientX - rect.left) * (adventureCanvas.width / rect.width);
  adv.mouseY = (e.clientY - rect.top) * (adventureCanvas.height / rect.height);
});

function exitAdventure() {
  if (adv && !adv.done) {
    toast('Adventure abandoned!!', '#ffaaaa');
  }
  showScreen(SCREENS.HOMEVIEW, currentArea);
}

function initBreeding() {
  const container = document.getElementById('breed-parents');
  const result = document.getElementById('breeding-result');
  container.innerHTML = '';
  result.innerHTML = '';

  let selectedPets = [];

  // Build full creature list — originals + babies
  const allCreatures = [
    ...gameState.adoptedPets.map(petId => ({
      id: petId,
      name: areaData[petId].pet,
      emoji: areaData[petId].petEmoji,
      color: areaData[petId].color,
      age: gameState.petAges[petId] || 0,
      canBreed: canBreed(petId),
    })),
    ...((gameState.babies || []).map((baby, i) => ({
      id: 'baby_' + i,
      name: baby.name,
      emoji: baby.emoji,
      color: baby.color || '#ff88ee',
      age: baby.age || 0,
      canBreed: (baby.age || 0) >= BREED_AGE,
      isBaby: true,
      babyIndex: i,
    }))),
  ];

  const breedableCreatures = allCreatures.filter(c => c.canBreed);

  if (allCreatures.length < 2) {
    document.getElementById('breed-instructions').textContent =
      'Adopt at least two pets to start breeding!!';
  } else {
    document.getElementById('breed-instructions').textContent =
      'Pick two creatures (age ' + BREED_AGE + '+) to combine their magic!!';
  }

  if (breedableCreatures.length < 2) {
    container.innerHTML = `
      <div style="grid-column:1/-1;text-align:center;padding:20px;background:#12122a;border-radius:14px;border:1px solid rgba(255,180,255,0.2)">
        <p style="font-family:'Nunito',sans-serif;color:#aaaacc;font-size:0.9rem;line-height:1.8">
          Your creatures need to go on more adventures to grow older!!<br>
          Creatures can breed when their age reaches ${BREED_AGE}!!<br><br>
          ${allCreatures.length === 0
            ? '<em>No creatures yet — adopt some pets first!!</em>'
            : allCreatures.map(c =>
                `${c.emoji} <strong style="color:${c.color}">${c.name}</strong>: Age ${c.age}/${BREED_AGE} ${c.canBreed ? '✅ READY!!' : ''}`
              ).join('<br>')}
        </p>
      </div>
    `;
    renderBabiesGrid();
    return;
  }

  breedableCreatures.forEach(creature => {
    const card = document.createElement('div');
    card.className = 'breed-card ready';
    card.style.borderColor = creature.color + '55';
    card.innerHTML = `
      <div class="breed-emoji">${creature.emoji}</div>
      <p class="breed-name" style="color:${creature.color}">${creature.name.toUpperCase()}</p>
      <p class="age-bar">Age ${creature.age}</p>
    `;
    card.addEventListener('click', () => {
      const already = selectedPets.find(p => p.id === creature.id);
      if (already) {
        selectedPets = selectedPets.filter(p => p.id !== creature.id);
        card.classList.remove('selected');
        card.style.borderColor = creature.color + '55';
        card.style.boxShadow = '0 0 14px rgba(100,255,180,0.25)';
        result.innerHTML = '';
      } else if (selectedPets.length < 2) {
        selectedPets.push(creature);
        card.classList.add('selected');
        card.style.borderColor = creature.color;
        card.style.boxShadow = `0 0 22px ${creature.color}66`;
      }
      if (selectedPets.length === 2) {
        showBreedingResult(selectedPets[0], selectedPets[1], result);
      }
    });
    container.appendChild(card);
  });

  renderBabiesGrid();
}

function renderBabiesGrid() {
  const grid = document.getElementById('babies-grid');
  if (!gameState.babies || gameState.babies.length === 0) {
    grid.innerHTML = `<p style="grid-column:1/-1;font-family:'Dancing Script',cursive;font-size:1.15rem;color:rgba(255,180,255,0.6);text-align:center">"No babies yet!! Try combining!!"</p>`;
    return;
  }
  grid.innerHTML = gameState.babies.map(b => {
    const color = b.color || '#ff88ee';

function confirmBreedingCreatures() {
  if (!window.pendingBreed) return;
  const { creature1, creature2, baby } = window.pendingBreed;

  if (!gameState.babies) gameState.babies = [];
  gameState.babies.push({
    name: baby.name,
    emoji: baby.emoji,
    color: baby.color,
    description: baby.description,
    isStorm: !!baby.isStorm,
    age: 0,
    id: 'baby_' + Date.now(),
  });

  // Age the parents
  if (!creature1.isBaby) {
    gameState.petAges[creature1.id] = (gameState.petAges[creature1.id] || 0) + 2;
  } else if (gameState.babies[creature1.babyIndex]) {
    gameState.babies[creature1.babyIndex].age = (gameState.babies[creature1.babyIndex].age || 0) + 2;
  }
  if (!creature2.isBaby) {
    gameState.petAges[creature2.id] = (gameState.petAges[creature2.id] || 0) + 2;
  } else if (gameState.babies[creature2.babyIndex]) {
    gameState.babies[creature2.babyIndex].age = (gameState.babies[creature2.babyIndex].age || 0) + 2;
  }

  saveState();
  window.pendingBreed = null;

  if (baby.isStorm) {
    triggerStormCelebration();
  } else {
    toast('🥚 ' + baby.name + ' has been born!!', baby.color);
    initBreeding();
  }
}

    </p>

              color:rgba(255,255,255,0.9);margin-bottom:12px;line-height:1.5">

// ============================================================
// COLLECTION
// ============================================================
function initCollection() {
  const grid = document.getElementById('collection-grid');
  grid.innerHTML = '';
  const ordered = ['fire','water','wind','earth','rainbow'];
  const allFourAdopted = ['fire','water','wind','earth'].every(p => gameState.adoptedPets.includes(p));

  ordered.forEach(id => {
    const area = areaData[id];
    const isAdopted = gameState.adoptedPets.includes(id);
    const isLocked = id === 'rainbow' && !allFourAdopted;
    const path = paths.find(p => p.id === gameState.petPaths[id]);
    const adventures = gameState.adventuresCompleted[id] || 0;
    const age = gameState.petAges[id] || 0;

    const card = document.createElement('div');
    card.className = 'collection-card';
    card.style.borderColor = isAdopted ? area.color + '55' : 'rgba(80,80,80,0.3)';
    card.style.boxShadow = isAdopted ? `0 0 20px ${area.color}22` : 'none';
    card.style.opacity = isLocked ? '0.4' : '1';
    card.innerHTML = `
      <div class="coll-emoji">${isLocked ? '🔒' : isAdopted ? area.petEmoji : '❓'}</div>
      <p class="coll-pet" style="color:${isAdopted ? area.color : '#666688'}">${isAdopted ? area.pet.toUpperCase() : isLocked ? 'LOCKED' : '???'}</p>
      <p class="coll-meta">${isAdopted ? `Age ${age} · ${adventures} adventures` : (isLocked ? 'Adopt all four elemental pets!!' : `Visit ${area.name} to adopt!!`)}</p>
      ${isAdopted && path ? `<span class="coll-path" style="color:${path.color};border:1px solid ${path.color}55;background:${path.color}15">${path.emoji} ${path.name}</span>` : ''}
    `;
    if (isAdopted) {
      card.style.cursor = 'pointer';
      card.addEventListener('click', () => showScreen(SCREENS.HOMEVIEW, id));
    }
    grid.appendChild(card);
  });

  const babyCount = (gameState.babies || []).length;
  const adoptedCount = gameState.adoptedPets.length;
  const hint = document.getElementById('collection-hint');
  if (adoptedCount === 0) hint.textContent = 'You have not adopted any pets yet!! Visit the forest to meet them!!';
  else if (adoptedCount < 4) hint.textContent = `${adoptedCount} pet${adoptedCount>1?'s':''} adopted!! Adopt all four to unlock Element!!`;
  else if (adoptedCount === 4) hint.textContent = 'All four elemental pets adopted!! The Rainbow Center is now unlocked!!';
  else hint.textContent = `All five pets adopted${babyCount ? ` and ${babyCount} bab${babyCount>1?'ies':'y'} born` : ''}!! You are a true Elemental Forest Explorer!!`;
}

// ============================================================
// RESET
// ============================================================
function collectMaterials() {
  const boost = {
    rainbowDust: Math.floor(Math.random()*3)+1,
    magicalWater: Math.floor(Math.random()*3)+1,
    fireCrystals: Math.floor(Math.random()*3)+1,
    shapeshiftingFlowers: Math.floor(Math.random()*3)+1,
    cloudInBottle: Math.floor(Math.random()*3)+1,
  };
  Object.entries(boost).forEach(([mat, amt]) => {
    gameState.materials[mat] = (gameState.materials[mat] || 0) + amt;
  });
  saveState();
  updateTopMats();
  const total = Object.values(boost).reduce((a,b) => a+b, 0);
  toast(`🌿 Foraged ${total} materials from the forest!!`, '#88ff88');
}

function resetForest() {
  if (!confirm('Release all your pets and reset the forest? This cannot be undone.')) return;
  gameState = JSON.parse(JSON.stringify(defaultState));
  saveState();
  updateTopMats();
  toast('The forest is fresh again!!', '#88ff88');
  showScreen(SCREENS.MAP);
}

// ============================================================
// MAIN LOOP
// ============================================================
function loop() {
  frame++;
  // Spawn forest materials every ~10s when on map
  if (frame - gameState.lastMaterialSpawn > 600 && gameState.forestMaterials.length < 5) {
    spawnForestMaterial();
    gameState.lastMaterialSpawn = frame;
  }

  if (currentScreen === SCREENS.MAP) {
    drawDetailedMap(mapCtx, mapCanvas.width, mapCanvas.height, frame, gameState, hoveredArea);
  } else if (currentScreen === SCREENS.SEARCH) {
    const scene = searchScenes[currentArea];
    scene.draw(searchCtx, searchCanvas.width, searchCanvas.height, frame);
    if (!petFound && scene.petAlpha) {
      const px = scene.petX * searchCanvas.width;
      const py = scene.petY * searchCanvas.height;
      searchCtx.save();
      searchCtx.globalAlpha = scene.petAlpha;
      searchCtx.font = '46px serif';
      searchCtx.textAlign = 'center';
      searchCtx.textBaseline = 'middle';
      searchCtx.shadowColor = areaData[currentArea].color;
      searchCtx.shadowBlur = 18;
      searchCtx.fillText(areaData[currentArea].petEmoji, px, py);
      searchCtx.restore();
    }
    drawClickSparkles(searchCtx, frame);
  } else if (currentScreen === SCREENS.BUILD) {
    drawRoom(currentArea);
  } else if (currentScreen === SCREENS.ADOPT) {
    drawAdoptionCeremony(adoptCtx, adoptCanvas.width, adoptCanvas.height, frame, currentArea);
  } else if (currentScreen === SCREENS.PATH) {
    drawPathSelection(pathCtx, pathCanvas.width, pathCanvas.height, frame);
  } else if (currentScreen === SCREENS.HOMEVIEW) {
    drawHomeView(homeviewCtx, homeviewCanvas.width, homeviewCanvas.height, frame, currentArea);
  } else if (currentScreen === SCREENS.ADVENTURE) {
    updateAdventureLogic();
    drawAdventure(adventureCtx, adventureCanvas.width, adventureCanvas.height, frame);
  }

  requestAnimationFrame(loop);
}

// Init
updateTopMats();
showScreen(SCREENS.MAP);
loop();

// Expose for inline handlers
window.showScreen = showScreen;
window.SCREENS = SCREENS;
window.startAdoption = function() { showScreen(SCREENS.ADOPT, currentArea); };
window.startAdventureFromHome = startAdventureFromHome;
window.changePath = changePath;
window.exitAdventure = exitAdventure;
window.confirmBreedingCreatures = confirmBreedingCreatures;
window.startInkblotBattle = startInkblotBattle;
window.collectMaterials = collectMaterials;
window.resetForest = resetForest;
</script>
